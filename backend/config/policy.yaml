max_retries_per_transaction: 3
# Closed-loop: how many times a single transaction may be re-optimized (webhook
# failures for the same transaction) before recovery is stopped and escalated.
max_recovery_steps: 3
min_cooling_hours: 24
rbi_afa_threshold_paise: 1500000
max_discount_percent: 10
max_contacts_per_week: 3
max_contacts_per_day: 3
contact_window_start: "08:00"
contact_window_end: "21:00"

channels:
  priority: ["whatsapp", "sms", "email"]
  backup: ["voice"]

escalation_threshold_paise: 500000

baseline_rates:
  card_payment_failure: 0.08
  recurring_payment_failure: 0.10
  checkout_abandonment: 0.03
  overdue_invoice: 0.15
