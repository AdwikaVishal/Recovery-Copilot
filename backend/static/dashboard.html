/* ---------------- GUARDRAILS ---------------- */
function Guardrails({guardrails,safety,traces,verify,openDrawer}){
    const[sel,setSel]=useState(0);
    const[stp,setStp]=useState(0);
    const[gopen,setGopen]=useState({});
    if(!guardrails)return <Spinner/>;
    const s=guardrails.summary;
    const tracesList=traces||[];
    const t=tracesList[sel];
    const vCls=t&&t.verdict?String(t.verdict).toLowerCase():'';
    return(
        <div>
            <div className="hero-row">
                <div className="card tight stat"><div className="k">Enforced Controls</div><div className="v">{guardrails.checks.length}</div><div className="s">ALLOW · MODIFY · DENY</div></div>
                <div className="card tight stat"><div className="k">Events Evaluated</div><div className="v">{s.actions_evaluated}</div><div className="s">one verdict per event</div></div>
                <div className="card tight stat"><div className="k">Denied</div><div className="v accent-red">{s.actions_blocked}</div><div className="s">+ {s.actions_modified} modified</div></div>
                <div className="card tight stat"><div className="k">Human Review</div><div className="v accent-amber">{s.human_review}</div><div className="s">{s.pending} pending confirmation</div></div>
            </div>

            <div className="section">
                <H title="Policy Gate" sub="A hard boundary — no recovery action bypasses policy." right={<span className={`chip ${s.actions_blocked===0?'ok':'warn'}`}>enforcing live</span>}/>
                <div className="card tight">
                    <div className="gate-wrap">
                        <div className="gate-score">
                            <div className="gv">{guardrails.checks.length}/{guardrails.checks.length}</div>
                            <div className="gl">Passed</div>
                        </div>
                        <div className="gate-tally">
                            <div className="gate-tile ok"><div className="k">Allowed</div><div className="v">{(s.actions_allowed||0)+(s.pending||0)}</div></div>
                            <div className="gate-tile warn"><div className="k">Modified</div><div className="v">{s.actions_modified||0}</div></div>
                            <div className="gate-tile bad"><div className="k">Denied</div><div className="v">{s.actions_blocked||0}</div></div>
                            <div className="gate-tile warn"><div className="k">Human Review</div><div className="v">{s.human_review||0}</div></div>
                        </div>
                        <div style={{flex:1,minWidth:220,fontSize:12.5,color:'var(--ink-2)',lineHeight:1.75}}>
                            <div style={{fontWeight:700,color:'var(--ink-2)',marginBottom:6}}>No recovery action bypasses policy.</div>
                            The optimizer proposes <b>{s.actions_evaluated}</b> candidate actions. Policy agents check every one against <b>{guardrails.checks.length} hard controls</b> — opt-out, AFA ceiling, retry budget, cooling, contact cadence, amount ceiling, rights-aware discounts, discount cap, risk, and diagnosis confidence. Only actions that pass are allowed to execute.
                        </div>
                    </div>
                </div>
            </div>

            <div className="section">
                <H title="Enforced Controls" sub="Click a control to see what it does"/>
                <div className="grid3">
                    {guardrails.checks.map(ch=>(
                        <div className="gcell" key={ch.name} onClick={()=>setGopen(p=>({...p,[ch.name]:!p[ch.name]}))}>
                            <div className="gn"><span className="check-mark pass" style={{background:'transparent',border:'1px solid var(--border)'}}>✓</span>{ch.name}</div>
                            <div className="gc">{gopen[ch.name]?ch.description:ch.config}</div>
                            <div className="gc" style={{fontWeight:600,color:'var(--green)',marginTop:2}}>{gopen[ch.name]?ch.config:''}</div>
                        </div>
                    ))}
                </div>
            </div>

            {safety&&(
                <div className="section">
                    <H title="Safety Verdict" sub="Post-hoc checks that no unsafe action ever executed"/>
                    <div className="card" style={{display:'flex',flexWrap:'wrap',gap:18,alignItems:'center'}}>
                        {(safety.afa_violations||0)+(safety.opt_out_violations||0)+(safety.excess_retries||0)===0
                            ?<span className="badge live"><span className="dot"></span>0 unsafe executions — every action stayed inside the guardrails</span>
                            :<span className="badge warn"><span className="dot"></span>{safety.afa_violations+safety.opt_out_violations+safety.excess_retries} safety violations found</span>}
                        <span className="k" style={{color:'var(--ink-3)'}}>AFA {safety.afa_violations} · opt-out {safety.opt_out_violations} · excess retries {safety.excess_retries} · false recovery {(safety.false_recovery_rate*100).toFixed(0)}%</span>
                    </div>
                </div>
            )}

            <div className="section">
                <H title="Guardrail Trace — Live Proof" sub="The exact decision path for adversarial scenarios"/>
                {tracesList.length>0&&(
                    <div className="trace-tabs">
                        {tracesList.map((tr,i)=>(
                            <button key={tr.scenario_id} className={`trace-tab ${sel===i?'active':''}`} onClick={()=>{setSel(i);setStp(0)}}>
                                {tr.verdict} · {tr.scenario_id.replace('demo_','').replace('chaos_','').replace(/_/g,' ')}
                            </button>
                        ))}
                    </div>
                )}
                {t&&(
                    <div className="card tight">
                        <div style={{display:'flex',flexWrap:'wrap',gap:12,alignItems:'center',marginBottom:14}}>
                            <span className={`chip ${t.verdict==='ALLOW'?'ok':t.verdict==='DENY'?'bad':'warn'}`}>{t.verdict}</span>
                            <span style={{fontSize:13,color:'var(--ink-2)'}}>{t.description}</span>
                            <div className="spacer"></div>
                            <span style={{fontSize:12,fontWeight:600}}>{fmt(t.amount)}</span>
                            {t.proposed_discount>0&&<span className="chip warn">{t.proposed_discount}% discount proposed</span>}
                        </div>
                        {t.steps.map((s,i)=>(
                            <div key={i} className="step-row" onClick={()=>setStp(i)}>
                                <div className={`step-ico ${i<stp?'done':i===stp?'active':t.fired_rule&&i===String(t.steps).indexOf('Policy')?'fail':'wait'}`}>
                                    {i<stp?'✓':(t.fired_rule&&i===3?'✕':i+1)}
                                </div>
                                <div className="step-body">
                                    <div className="step-title">{s.icon||''} {s.agent}</div>
                                    <div className="step-detail mono" style={{fontSize:11.5}}>→ {s.output}</div>
                                    <div className="step-detail">{s.detail}</div>
                                </div>
                            </div>
                        ))}
                        {t.fired_rule&&(
                            <div className="verdict-box deny">
                                <div style={{fontWeight:700,color:'var(--red)'}}>Rule fired: {t.fired_rule}</div>
                                <div style={{fontSize:12.5,color:'var(--ink-2)',marginTop:4}}>{t.fired_explanation}</div>
                                {t.modified_request&&<div style={{fontSize:12.5,marginTop:6}}><b>Modified:</b> {t.original_request?.action} ({t.original_request?.discount_percent}% discount) → {t.modified_request.action} ({t.modified_request.discount_percent}%)</div>}
                            </div>
                        )}
                        <div style={{marginTop:14}}>
                            <div className="k" style={{fontSize:10.5,fontWeight:700,textTransform:'uppercase',letterSpacing:.5,color:'var(--ink-3)',marginBottom:6}}>Policy checks</div>
                            {t.checks.map((c,i)=>(
                                <div className="check-row" key={i}>
                                    <span className={`check-mark ${c.result==='PASS'?'pass':'fail'}`}>{c.result==='PASS'?'✓':'✗'}</span>
                                    <span className="check-rule">{c.rule}</span>
                                    <span className="check-exp" style={{flex:1}}>{c.explanation}</span>
                                    {c.regulatory_basis&&<span className="check-exp" style={{color:'var(--blue)'}}>{c.regulatory_basis}</span>}
                                </div>
                            ))}
                        </div>
                    </div>
                )}
                {!tracesList.length&&<div className="empty"><div className="eico">◌</div>Guardrail traces could not be loaded.</div>}
            </div>

            {verify&&(
                <div className="section">
                    <H title="Audit Chain Integrity" sub="Tamper-evident hash chain over every decision"/>
                    <div className="card" style={{display:'flex',alignItems:'center',gap:16}}>
                        <span className={`badge ${verify.valid?'live':'bad'}`}><span className="dot"></span>{verify.valid?'CHAIN INTACT':'CHAIN BROKEN'}</span>
                        <span className="k" style={{color:'var(--ink-3)'}}>{verify.entries} entries verified · {verify.message}</span>
                    </div>
                </div>
            )}
        </div>
    );
}

/* ---------------- AUDIT ---------------- */
function Audit({audit,verify,openDrawer}){
    const[filter,setFilter]=useState('all');
    const[q,setQ]=useState('');
    const[answer,setAnswer]=useState(null);
    const[busy,setBusy]=useState(false);
    const ask=async()=>{
        if(!q.trim())return;setBusy(true);
        try{setAnswer(await fetch(`${API}/api/audit/query?q=${encodeURIComponent(q)}`).then(r=>r.json()))}catch(e){setAnswer({answer:'Error querying audit log.'})}
        setBusy(false);
    };
    const rows=(audit||[]).filter(e=>{
        if(filter==='all')return true;
        if(filter==='confirmed')return e.result==='success';
        return finalStatus(e)===filter;
    });
    return(
        <div>
            <div style={{marginBottom:18}}>
                <H title="Ask the audit log"/>
                <div style={{display:'flex',gap:10,alignItems:'center'}}>
                    <input className="input" style={{maxWidth:520}} value={q} onChange={e=>setQ(e.target.value)} placeholder={'Why didn\u2019t we retry txn_047? Try any transaction id.'} onKeyDown={e=>e.key==='Enter'&&ask()}/>
                    <button className="btn primary" onClick={ask} disabled={busy}>{busy?'Searching…':'Ask'}</button>
                    {verify&&<span style={{marginLeft:'auto'}}>
                        <span className={`chip ${verify.valid?'ok':'bad'}`}>{verify.valid?'✓ Chain verified · '+(verify.entries||0)+' entries':'✗ Chain broken'}</span>
                    </span>}
                </div>
                {answer&&<div className="answer" style={{marginTop:12}}><b>Answer:</b> {answer.answer}</div>}
            </div>

            <H title="Decision Log" sub="Every event, every verdict, every rule"/>
            <div className="filterbar">
                {[['all','All'],['ALLOW','Allowed'],['MODIFY','Modified'],['DENY','Denied'],['HUMAN_REVIEW','Human Review'],['confirmed','Confirmed']].map(([v,l])=>(
                    <button key={v} className={`fbtn ${filter===v?'on':''}`} onClick={()=>setFilter(v)}>{l}</button>
                ))}
            </div>
            <div className="card" style={{padding:0,overflow:'hidden'}}>
                <table>
                    <thead><tr><th>Time</th><th>Event</th><th>Customer</th><th>Action</th><th className="right">Amount</th><th>Policy</th><th>Result</th></tr></thead>
                    <tbody>
                        {rows.slice(0,80).map(e=>(
                            <tr key={e.event_id+'_'+e.timestamp} onClick={()=>openDrawer(e.event_id)}>
                                <td className="mono" style={{color:'var(--ink-3)'}}>{e.timestamp?e.timestamp.replace('T',' ').slice(0,19):''}</td>
                                <td><span className="mono">{e.event_id}</span></td>
                                <td>{e.customer_id}</td>
                                <td>{ACTION_LABELS[e.action]||e.action}</td>
                                <td className="right">{fmt(e.amount_attempted)}</td>
                                <td><PolicyChip v={verdictOf(e)} status={e.result}/></td>
                                <td><StatusChip s={e.result||e.workflow_status}/></td>
                            </tr>
                        ))}
                        {!rows.length&&<tr><td colSpan={7}><div className="empty">No entries for this filter.</div></td></tr>}
                    </tbody>
                </table>
            </div>
        </div>
    );
}

/* ---------------- EVALUATION ---------------- */
function Evaluation({res,busy,run}){
    if(!res&&!busy)return <div className="card"><Spinner/></div>;
    if(!res&&busy)return <div className="card"><div className="empty"><div className="eico">◌</div>Running the 20-scenario guardrail suite…</div></div>;
    if(res&&res.error)return <div className="card"><div className="empty">{res.error}<div style={{marginTop:10}}><button className="btn" onClick={run}>Retry</button></div></div></div>;
    const passed=res.passed,total=res.total,failed=res.failed||0;
    return(
        <div>
            <div className="card" style={{textAlign:'center',padding:'34px 22px',marginBottom:18}}>
                <div className="k" style={{color:'var(--ink-3)'}}>Scenario Evaluation · guardrail regression suite</div>
                <div style={{fontSize:52,fontWeight:700,letterSpacing:-1.5,marginTop:8}}><span style={{color:'var(--green)'}}>{passed}</span><span style={{color:'var(--ink-3)'}}>/{total}</span></div>
                <div style={{fontSize:15,fontWeight:600,color:'var(--green)',marginTop:4}}>PASSED · {pct(passed,total)}%</div>
                <div style={{marginTop:18}}><button className="btn primary" onClick={run} disabled={busy}>{busy?'Running…':'Rerun Evaluation'}</button></div>
            </div>
            <div className="hero-row" style={{gridTemplateColumns:'repeat(3,1fr)',marginTop:0}}>
                <div className="card tight stat"><div className="k">Passed</div><div className="v accent-green">{passed}</div><div className="s">expected control behaviour matched</div></div>
                <div className="card tight stat"><div className="k">Failed</div><div className="v accent-red">{failed}</div><div className="s">control-breach scenarios caught</div></div>
                <div className="card tight stat"><div className="k">Scenarios</div><div className="v">{total}</div><div className="s">demo + chaos adversarial cases</div></div>
            </div>
            <div className="card" style={{padding:0,overflow:'hidden',marginTop:18}}>
                <table>
                    <thead><tr><th>Scenario</th><th>Expected</th><th>Actual</th><th>Result</th></tr></thead>
                    <tbody>
                        {(res.results||[]).map((r,i)=>(
                            <tr key={r.scenario_id||i} style={{cursor:'default'}}>
                                <td style={{fontWeight:600}}>{r.scenario_id}</td>
                                <td><span className="chip info">{r.expected_verdict}</span></td>
                                <td><span className={r.pass?'chip info':'chip bad'}>{r.actual_verdict}</span></td>
                                <td><span className={`chip ${r.pass?'ok':'bad'}`}>{r.pass?'✓ PASS':'✗ FAIL'}</span></td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        </div>
    );
}

/* ---------------- RECOVERY AI ---------------- */
function RecoveryAi(){
    const[info,setInfo]=useState(null);
    const[feats,setFeats]=useState(null);
    const[busy,setBusy]=useState(false);
    const[result,setResult]=useState(null);
    const[recent,setRecent]=useState([]);
    const[err,setErr]=useState(null);
    const[decF,setDecF]=useState({amount:850,payment_method:'apple_pay',decline_code:'generic_decline',retry_count:0});
    const[decResult,setDecResult]=useState(null);
    const[decBusy,setDecBusy]=useState(false);
    const[decisions,setDecisions]=useState([]);
    const[analytics,setAnalytics]=useState(null);
    const[f,setF]=useState({transaction_id:'txn_pred_1',customer_id:'cust_pred_1',transaction_date:'2024-10-01 14:30:00',status:'refunded',payment_method:'credit_card',quantity:1,unit_price:1200,total_amount:1200,discount_applied:0,shipping_cost:0,customer_signup_date:'2023-03-01'});
    const up=(k,v)=>setF(p=>({...p,[k]:v}));
    const dup=(k,v)=>setDecF(p=>({...p,[k]:v}));

    useEffect(()=>{
        fetch(API+'/api/recovery/model-info').then(r=>r.json()).then(setInfo).catch(()=>setInfo(null));
        fetch(API+'/api/recovery/features').then(r=>r.json()).then(setFeats).catch(()=>setFeats(null));
        fetch(API+'/api/recovery/predictions').then(r=>r.json()).then(setRecent).catch(()=>[]);
        fetch(API+'/api/recovery/outcomes').then(r=>r.json()).then(setDecisions).catch(()=>[]);
        fetch(API+'/api/recovery/analytics').then(r=>r.json()).then(setAnalytics).catch(()=>setAnalytics(null));
    },[]);

    const runDecision=async(execute)=>{
        const id='live_dec_'+(Date.now().toString(36));
        const body={transaction_id:id,customer_id:'cust_live',amount:Number(decF.amount),payment_method:decF.payment_method,decline_code:decF.decline_code,retry_count:Number(decF.retry_count||0)};
        setDecBusy(true);setDecResult(null);
        try{
            const r=await fetch(API+(execute?'/api/recovery/process':'/api/recovery/decision'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
            const j=await r.json();
            if(!r.ok)setDecResult({error:j.detail||('HTTP '+r.status)});
            else{setDecResult(j);fetch(API+'/api/recovery/outcomes').then(x=>x.json()).then(setDecisions).catch(()=>{});fetch(API+'/api/recovery/analytics').then(x=>x.json()).then(setAnalytics).catch(()=>{});}
        }catch(e){setDecResult({error:String(e)});}
        setDecBusy(false);
    };

    const score=async(warm)=>{
        const body={...f,quantity:Number(f.quantity),unit_price:Number(f.unit_price),total_amount:Number(f.total_amount),discount_applied:Number(f.discount_applied),shipping_cost:Number(f.shipping_cost)};
        if(warm)body.history=warm;
        setBusy(true);setErr(null);setResult(null);
        try{
            const r=await fetch(API+'/api/recovery/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
            const j=await r.json();
            if(!r.ok)setErr(j.detail||('HTTP '+r.status));
            else{setResult(j);fetch(API+'/api/recovery/predictions').then(x=>x.json()).then(setRecent).catch(()=>{});}
        }catch(e){setErr(String(e));}
        setBusy(false);
    };

    const riskChip=s=>s==='Very Low'||s==='Low'?<span className="chip ok">{s}</span>:
        s==='Medium'?<span className="chip info">{s}</span>:
        <span className="chip bad">{s}</span>;
    const pci=p=>p<0.02?'var(--green)':p<0.04?'var(--blue)':p<0.075?'var(--amber)':'var(--red)';
    const field=(k,label,type)=>(<div style={{flex:1,minWidth:150}}>
        <div style={{fontSize:11,fontWeight:700,color:'var(--ink-3)',letterSpacing:.4,textTransform:'uppercase',marginBottom:6}}>{label}</div>
        <input className="input" type={type||'text'} value={f[k]===undefined?'':f[k]} onChange={e=>up(k,e.target.value)}/>
    </div>);
    const grp=feats?feats.groups:null;

    return(
        <div>
            <div className="grid2" style={{alignItems:'stretch'}}>
                {/* PREDICT FORM */}
                <div className="card">
                    <H title="Score a transaction" sub="Refunded / cancelled / pending event — 44 raw features, leakage-safe."/>
                    <div style={{display:'flex',flexDirection:'column',gap:12}}>
                        <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
                            {field('transaction_id','Transaction ID')}
                            {field('customer_id','Customer ID')}
                        </div>
                        <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
                            {field('transaction_date','Transaction Date','datetime-local')}
                            {field('customer_signup_date','Signup Date','datetime-local')}
                        </div>
                        <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
                            <div style={{flex:1,minWidth:150}}>
                                <div style={{fontSize:11,fontWeight:700,color:'var(--ink-3)',letterSpacing:.4,textTransform:'uppercase',marginBottom:6}}>Status</div>
                                <select className="input" value={f.status} onChange={e=>up('status',e.target.value)}>
                                    <option value="refunded">refunded</option>
                                    <option value="cancelled">cancelled</option>
                                    <option value="pending">pending</option>
                                </select>
                            </div>
                            <div style={{flex:1,minWidth:150}}>
                                <div style={{fontSize:11,fontWeight:700,color:'var(--ink-3)',letterSpacing:.4,textTransform:'uppercase',marginBottom:6}}>Payment Method</div>
                                <select className="input" value={f.payment_method} onChange={e=>up('payment_method',e.target.value)}>
                                    {['credit_card','debit_card','paypal','google_pay','apple_pay','bank_transfer','upi'].map(m=><option key={m} value={m}>{m}</option>)}
                                </select>
                            </div>
                        </div>
                        <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
                            {field('quantity','Quantity','number')}
                            {field('unit_price','Unit Price','number')}
                            {field('total_amount','Total Amount','number')}
                        </div>
                        <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
                            {field('discount_applied','Discount','number')}
                            {field('shipping_cost','Shipping','number')}
                        </div>
                        <div className="btn-row" style={{marginTop:6}}>
                            <button className="btn primary" onClick={()=>score()} disabled={busy}>{busy?'Scoring…':'Score Transaction'}</button>
                            <span className="k" style={{color:'var(--ink-3)'}}>model loads once · frozen artifacts · no retraining</span>
                        </div>
                        {err&&<div className="answer" style={{borderColor:'#f2c8c8',background:'#fdf2f2',color:'var(--red)'}}><b>Error:</b> {err}</div>}
                    </div>
                </div>

                {/* RESULT */}
                <div className="card">
                    <H title="Recovery Risk" sub="ML Frozen Model · Calibrated probability · threshold 0.04"/>
                    {!result&&!busy&&<div className="empty"><div className="eico">◉</div>Score a transaction to see its recovery risk here.</div>}
                    {busy&&!result&&<div className="empty"><div className="eico">◌</div>Running 44-feature pipeline → ExtraTrees → calibration…</div>}
                    {result&&(
                        <div>
                            <div style={{display:'flex',alignItems:'center',gap:18,flexWrap:'wrap'}}>
                                <div>
                                    <div style={{fontSize:44,fontWeight:750,letterSpacing:-1,color:pci(result.recovery_probability),fontVariantNumeric:'tabular-nums'}}>{(result.recovery_probability*100).toFixed(2)}%</div>
                                    <div className="k" style={{color:'var(--ink-3)'}}>ML model calibrated recovery probability</div>
                                </div>
                                <div style={{display:'flex',flexDirection:'column',gap:8}}>
                                    <div>{riskChip(result.recovery_risk)} <span className="k" style={{marginLeft:6,color:'var(--ink-3)'}}>{result.risk_band} band</span></div>
                                    <div>{result.recovery_prediction===1
                                        ?<span className="chip info">Likely to recover</span>
                                        :<span className="chip muted">Unlikely to recover</span>}
                                        <span className="k" style={{marginLeft:6,color:'var(--ink-3)'}}>threshold {result.threshold}</span></div>
                                    <div style={{fontSize:11,color:'var(--ink-3)'}}>raw {result.probability_raw} · {result.model} · {result.model_artifact}</div>
                                </div>
                            </div>
                            <div style={{marginTop:16,paddingTop:14,borderTop:'1px dashed var(--border-strong)'}}>
                                <div className="section-sub" style={{fontWeight:700}}>Top contributing features <span className="k" style={{color:'var(--ink-3)'}}>(impurity importance)</span></div>
                                <div style={{display:'flex',flexDirection:'column',gap:6,marginTop:8}}>
                                    {(result.explanation||[]).map((x,i)=>(
                                        <div className="cand-row" key={i} style={{padding:'7px 10px'}}>
                                            <span className="mono" style={{color:'var(--accent)',fontWeight:600}}>{x.feature}</span>
                                            <span className="spacer"></span>
                                            <span className="mono" style={{color:'var(--ink-2)'}}>{typeof x.value==='number'?x.value.toLocaleString():String(x.value)}</span>
                                            <span className="k" style={{color:'var(--ink-3)',minWidth:56,textAlign:'right'}}>{x.importance.toFixed(4)}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            </div>

            {/* AI DECISION — closed loop: ML -> AI -> policy -> outcome */}
            <div className="section">
                    <H title="ML → AI Recovery Decision" sub="Trained Model (ML probability) → AI Decision → Deterministic Policy Engine → (simulated) execution. probability_source traced end-to-end."/>
                <div className="grid2" style={{alignItems:'stretch'}}>
                    <div className="card">
                        <div style={{display:'flex',flexDirection:'column',gap:12}}>
                            <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
                                <div style={{flex:1,minWidth:150}}>
                                    <div style={{fontSize:11,fontWeight:700,color:'var(--ink-3)',letterSpacing:.4,textTransform:'uppercase',marginBottom:6}}>Amount (₹)</div>
                                    <input className="input" type="number" value={decF.amount} onChange={e=>dup('amount',e.target.value)}/>
                                </div>
                                <div style={{flex:1,minWidth:150}}>
                                    <div style={{fontSize:11,fontWeight:700,color:'var(--ink-3)',letterSpacing:.4,textTransform:'uppercase',marginBottom:6}}>Payment Method</div>
                                    <select className="input" value={decF.payment_method} onChange={e=>dup('payment_method',e.target.value)}>
                                        {['credit_card','debit_card','paypal','google_pay','apple_pay','bank_transfer','upi'].map(m=><option key={m} value={m}>{m}</option>)}
                                    </select>
                                </div>
                                <div style={{flex:1,minWidth:150}}>
                                    <div style={{fontSize:11,fontWeight:700,color:'var(--ink-3)',letterSpacing:.4,textTransform:'uppercase',marginBottom:6}}>Decline Code</div>
                                    <select className="input" value={decF.decline_code} onChange={e=>dup('decline_code',e.target.value)}>
                                        {['generic_decline','insufficient_funds','bank_timeout','expired_card','incorrect_cvc','mandate_afa_required','do_not_honor','processing_error'].map(m=><option key={m} value={m}>{m}</option>)}
                                    </select>
                                </div>
                            </div>
                            <div className="btn-row">
                                <button className="btn primary" onClick={()=>runDecision(false)} disabled={decBusy}>{decBusy?'…':'Get AI Decision'}</button>
                                <button className="btn" onClick={()=>runDecision(true)} disabled={decBusy}>{decBusy?'…':'Full Run (execute + record)'}</button>
                                <span className="k" style={{color:'var(--ink-3)'}}>advisory mode does not execute · full run is simulation-labelled</span>
                            </div>
                        </div>
                    </div>
                    <div className="card">
                        {!decResult&&!decBusy&&<div className="empty"><div className="eico">◉</div>Run the closed loop to see prediction → decision → verdict.</div>}
                        {decBusy&&!decResult&&<div className="empty"><div className="eico">◌</div>ML bridge → optimizer → supervisor → policy engine…</div>}
                        {decResult&&decResult.error&&<div className="answer" style={{borderColor:'#f2c8c8',background:'#fdf2f2',color:'var(--red)'}}><b>Error:</b> {decResult.error}</div>}
                        {decResult&&!decResult.error&&(
                            <div style={{display:'flex',flexDirection:'column',gap:10}}>
                                <div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
                                    <div>
                                        <div style={{fontSize:34,fontWeight:750,letterSpacing:-1,color:pci(decResult.recovery_probability),fontVariantNumeric:'tabular-nums'}}>{(decResult.recovery_probability*100).toFixed(2)}%</div>
                                        <div className="k" style={{color:'var(--ink-3)'}}>ML Recovery Probability <span style={{color:'var(--ink-2)',fontWeight:600}}>· frozen model</span> <span className="chip muted" style={{marginLeft:6}}>threshold {decResult.threshold}</span></div>
                                    </div>
                                    <div style={{display:'flex',flexDirection:'column',gap:6}}>
                                        <div style={{fontWeight:700,color:'var(--accent)',fontSize:15}}>{decResult.ai_decision}</div>
                                        <div className="k" style={{color:'var(--ink-3)'}}>{decResult.action} · {decResult.channel}</div>
                                    </div>
                                </div>
                                <div className="cand-row" style={{padding:'7px 10px'}}>
                                    <span className="k" style={{color:'var(--ink-3)'}}>probability_source</span>
                                    <span className="spacer"></span>
                                    <span className="mono" style={{fontWeight:600}}>{decResult.probability_source}</span>
                                </div>
                                <div className="cand-row" style={{padding:'7px 10px'}}>
                                    <span className="k" style={{color:'var(--ink-3)'}}>policy verdict</span>
                                    <span className="spacer"></span>
                                    <span className="mono" style={{fontWeight:600}}>{decResult.policy_verdict} <span className="chip muted" style={{marginLeft:8}}>{decResult.risk_label} · {decResult.risk_band}</span></span>
                                </div>
                                <div className="cand-row" style={{padding:'7px 10px',alignItems:'flex-start'}}>
                                    <span className="k" style={{color:'var(--ink-3)'}}>reasoning</span>
                                    <span className="spacer"></span>
                                    <span className="mono" style={{color:'var(--ink-2)',textAlign:'right',fontSize:11}}>{(decResult.reasoning||[]).slice(0,6).join(' · ')}</span>
                                </div>
                                <div className="cand-row" style={{padding:'7px 10px'}}>
                                    <span className="k" style={{color:'var(--ink-3)'}}>action_mode</span>
                                    <span className="spacer"></span>
                                    <span className="mono" style={{fontWeight:600}}>{decResult.action_mode} <span className="chip muted" style={{marginLeft:8}}>outcome {decResult.outcome}</span></span>
                                </div>
                                <div className="cand-row" style={{padding:'7px 10px'}}>
                                    <span className="k" style={{color:'var(--ink-3)'}}>expected</span>
                                    <span className="spacer"></span>
                                    <span className="mono" style={{color:'var(--ink-2)',textAlign:'right',fontSize:11}}>{decResult.expected_outcome}</span>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            </div>

            {/* CLOSED-LOOP OUTCOME LEDGER + ANALYTICS */}
            <div className="section">
                <H title="ML → AI → Outcome Ledger" sub="One row per transaction · ML P(source) → AI decision → Policy verdict → Action → Outcome · confirmed recovery only via trusted webhook."/>
                <div className="card" style={{padding:0,overflowX:'auto'}}>
                    <table>
                        <thead><tr><th>Transaction</th><th>P Source</th><th>AI Decision</th><th>Policy</th><th>Action (mode)</th><th>Outcome</th><th>Recovered</th><th>Time</th></tr></thead>
                        <tbody>
                            {decisions.map((d,i)=>(
                                <tr key={d.id||i}>
                                    <td className="mono" style={{fontWeight:600}}>{d.transaction_id}</td>
                                    <td className="mono" style={{color:'var(--ink-2)'}}>{String(d.probability_source).slice(0,40)}</td>

                                    <td>{d.policy_verdict==='ALLOW'?<span className="chip ok">ALLOW</span>:d.policy_verdict==='MODIFY'?<span className="chip info">MODIFY</span>:d.policy_verdict==='DENY'?<span className="chip bad">DENY</span>:<span className="chip muted">{d.policy_verdict||''}</span>}</td>

                    </table>
                </div>
                {analytics&&(
                    <div className="hero-row" style={{marginTop:14}}>
                        <div className="card tight stat"><div className="k">Decisions</div><div className="v" style={{fontSize:20}}>{analytics.total_decisions}</div><div className="s">recorded in closed loop</div></div>
                        <div className="card tight stat"><div className="k">ML Sources</div><div className="v" style={{fontSize:20}}>{Object.keys(analytics.by_probability_source||{}).map(s=>s.includes('ml')?'ML':'RULE-BASED').join(' · ')}</div><div className="s">{(analytics.by_probability_source||{}).hasOwnProperty?Object.entries(analytics.by_probability_source||{}).map(([k,v])=>k+'='+v).join(' · '):''}</div></div>
                        <div className="card tight stat"><div className="k">Outcomes</div><div className="v" style={{fontSize:20}}>{Object.values(analytics.by_outcome||{}).reduce((a,b)=>a+b,0)}</div><div className="s">{Object.entries(analytics.by_outcome||{}).map(([k,v])=>k+'='+v).join(' · ')}</div></div>
                        <div className="card tight stat"><div className="k">Recovered</div><div className="v" style={{fontSize:20,color:'var(--green)'}}>₹{analytics.recovered_amount}</div><div className="s">{analytics.recovered_count} confirmed via webhook</div></div>
                    </div>
                )}
            </div>

            {/* MODEL INFO */}
            <div className="section">
                <H title="Model Information" sub="Frozen research artifacts → production serving (never refit)."/>
                <div className="hero-row" style={{marginTop:0}}>
                    <div className="card tight stat"><div className="k">Algorithm</div><div className="v" style={{fontSize:18}}>{info?info.model:'…'}</div><div className="s">{info?(info.estimators+' estimators · class_weight=balanced'):''}</div></div>
                    <div className="card tight stat"><div className="k">Features</div><div className="v" style={{fontSize:18}}>{info?info.raw_features+` → `+info.encoded_features:'…'}</div><div className="s">44 raw → 49 encoded</div></div>
                    <div className="card tight stat"><div className="k">Calibration</div><div className="v" style={{fontSize:18}}>Sigmoid</div><div className="s">fit on validation · monotone</div></div>
                    <div className="card tight stat"><div className="k">Threshold</div><div className="v" style={{fontSize:18}}>{info?(info.threshold):'…'}</div><div className="s">{info?(info.threshold_artifact):''}</div></div>
                </div>
                {info&&info.test_metrics&&(
                    <div className="card tight" style={{marginTop:14,display:'flex',gap:26,flexWrap:'wrap',alignItems:'center'}}>
                        <span className="k" style={{color:'var(--ink-3)'}}>TEST PERFORMANCE</span>
                        <span>ROC-AUC <b>{info.test_metrics.roc_auc}</b></span>
                        <span>PR-AUC <b>{info.test_metrics.pr_auc}</b></span>
                        <span>Brier <b>{info.test_metrics.brier}</b></span>
                        <span>LogLoss <b>{info.test_metrics.logloss}</b></span>
                        <span>P <b>{info.test_metrics.precision}</b></span>
                        <span>R <b>{info.test_metrics.recall}</b></span>
                        <span>F1 <b>{info.test_metrics.f1}</b></span>
                        <span>Lift <b>{info.test_metrics.lift}x</b></span>
                        <span className="k" style={{color:'var(--ink-3)'}}>Target: recovered_72h · base rate {(info.recovery_rate_training*100).toFixed(2)}%</span>
                    </div>
                )}
            </div>

            {/* FEATURE GROUPS */}
            {feats&&(
                <div className="section">
                    <H title="Feature Pipeline" sub="44 raw features in exactly notebook order; payment_method one-hot → 49 encoded."/>
                    <div className="grid3">
                        {[['base',grp.base],['historical',grp.historical],['behavioral',grp.behavioral],['advanced',grp.advanced],['temporal',grp.temporal],['recovery_history',grp.recovery_history]].map(([g,list])=>(
                            <div className="card tight" key={g}>
                                <div style={{fontSize:11,fontWeight:700,color:'var(--accent)',letterSpacing:.5,textTransform:'uppercase',marginBottom:8}}>{g.replace('_',' ')} · {list.length} <span className="k" style={{color:'var(--ink-3)'}}>leakage-safe</span></div>
                                <div style={{display:'flex',flexWrap:'wrap',gap:5}}>{list.map(n=><span className="chip muted" key={n} style={{fontFamily:'ui-monospace,SFMono-Regular,Menlo,monospace',fontSize:10}}>{n}</span>)}</div>
                            </div>
                        ))}
                    </div>
                </div>
            )}

            {/* RECENT PREDICTIONS */}
            <div className="section">
                <H title="Recent Predictions" sub="Persisted best-effort · score single transactions to build the list."/>
                <div className="card" style={{padding:0,overflowX:'auto'}}>
                    <table>
                        <thead><tr><th>Transaction</th><th>Customer</th><th>ML Prob.</th><th>Risk</th><th>Prediction</th><th>Threshold</th><th>Time</th></tr></thead>
                        <tbody>
                            {recent.map((p,i)=>(
                                <tr key={p.id||i} style={{cursor:'default'}}>
                                    <td className="mono" style={{fontWeight:600}}>{p.transaction_id}</td>
                                    <td className="mono" style={{color:'var(--ink-2)'}}>{p.customer_id}</td>
                                    <td style={{fontWeight:700,color:pci(p.recovery_probability)}}>{(p.recovery_probability*100).toFixed(2)}%</td>
                                    <td>{riskChip(p.recovery_risk)}</td>
                                    <td>{p.recovery_prediction===1?<span className="chip info">Likely</span>:<span className="chip muted">Unlikely</span>}</td>
                                    <td className="mono" style={{color:'var(--ink-3)'}}>{p.threshold}</td>
                                    <td className="mono" style={{color:'var(--ink-3)'}}>{p.predicted_at?String(p.predicted_at).replace('T',' ').slice(0,19):''}</td>
                                </tr>
                            ))}
                            {!recent.length&&<tr><td colSpan={7} style={{textAlign:'center',color:'var(--ink-3)'}}>No persisted predictions yet.</td></tr>}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    );
}

/* ---------------- DRAWER ---------------- */
function TransactionDrawer({drawer,close}){
    useEffect(()=>{
        const h=e=>e.key==='Escape'&&close();
        window.addEventListener('keydown',h);
        return()=>window.removeEventListener('keydown',h);
    },[close]);

    const ev=drawer.event;
    const title=ev?TYPE_LABELS[ev.type]||ev.type:'Transaction';
    const amount=ev?ev.amount:(drawer.amount||0);
    const status=ev?ev.status:(drawer.status||'pending');
    const auditRow=drawer.audit;
    const pd=drawer.policy_decision;
    const specialist=drawer.specialist_calls||drawer.stages||[];

    const stages = drawer.stages || [];
    const cand=stages.find(s=>s.type==='strategy.candidates_generated');
    const rank=stages.find(s=>s.type==='strategy.ranked');
    const policySse=stages.find(s=>s.type==='policy.evaluated');
    const execSse=stages.find(s=>s.type==='payment.pending');
    const confSse=drawer.stages.find(s=>s.type==='payment.confirmed');

    const checks=pd&&pd.detailed_results?pd.detailed_results:[];
    const verdict=pd?pd.verdict:(policySse&&policySse.payload&&policySse.payload.verdict);

    const steps=buildSteps(drawer);
    const dec=!drawer.loading&&!drawer.notFound?normTraceDecision(drawer):null;
    const recoveredAmt=(confSse&&confSse.payload&&confSse.payload.amount)||(ev&&ev.recovered_amount)||(auditRow&&auditRow.recovered_amount)||0;
    const isRecovered=recoveredAmt>0||status==='confirmed'||status==='success';
    const isAwaiting=status==='pending'||status==='pending_webhook'||status==='processing';

    return(
        <>
            <div className="drawer-backdrop" onClick={close}></div>
            <div className="drawer">
                <div className="drawer-head">
                    <div>
                        <div className="dt" style={{fontSize:10.5,color:'var(--ink-3)',fontWeight:700,letterSpacing:.6,textTransform:'uppercase'}}>Transaction Trace</div>
                        <div style={{display:'flex',gap:10,alignItems:'center',marginTop:2}}>
                            <span style={{fontWeight:700,fontSize:15}}>{title}</span>
                            <StatusChip s={status}/>
                        </div>
                        <div className="dh-id">{drawer.id}</div>
                        <div className="dh-amt">{fmt(amount)}</div>
                    </div>
                    <button className="drawer-close" onClick={close}>✕</button>
                </div>
                <div className="drawer-body">
                    {drawer.loading&&<div className="empty"><div className="eico">◌</div>Loading decision trace…</div>}
                    {drawer.notFound&&(
                        <>
                            <div className="empty">No persisted trace for this real-time transaction.</div>
                            {drawer.stages&&drawer.stages.length>0&&<StepsList steps={drawer.stages} live/>}
                        </>
                    )}

                    {!drawer.loading&&!drawer.notFound&&(
                        <>
                            {dec&&(
                                <div className={`trace-banner ${isRecovered?'ok':(isAwaiting?'wait':'no')}`}>
                                    {isRecovered
                                        ?<span>✓ Trusted payment confirmation</span>
                                        :(isAwaiting?'● Recovery executed — waiting for trusted confirmation'
                                            :(status==='blocked'||status==='denied'?'✕ Policy blocked this attempt':'✕ No recovery claimed'))}
                                    <span className="tb-r">{isRecovered?'+'+fmt(recoveredAmt||amount)+' RECOVERED':(isAwaiting?'Awaiting webhook':'—')}</span>
                                </div>
                            )}

                            {dec&&(
                                <div className="drawer-sec">
                                    <h4>Why did we retry this?</h4>
                                    <div className="why-box">
                                        <div className="wh">Reasoning · explained</div>
                                        The recovery agent retried this payment because it classified the failure as <b>{dec.diagnosis||'a recoverable decline'}</b>{dec.confidence!=null?` with ${Math.round(dec.confidence*100)}% confidence`:''} — a pattern where retry is safe. It then compared policy-eligible candidates and picked <b>{dec.action||'the best action'}</b>{dec.expected_value?` — the one with the highest expected recovery value (${fmt(dec.expected_value)})`:'. No amount is claimed unless a payment is confirmed.'} Every candidate had to clear <b>{checks.length||10} hard policy checks</b> before execution — nothing bypasses the gate.
                                    </div>
                                </div>
                            )}

                            <div className="drawer-sec"><h4>Decision Path</h4><StepsList steps={steps}/></div>

                            {(cand||rank||pd||auditRow)&&(
                                <div className="drawer-sec">
                                    <h4>Recovery Optimizer</h4>
                                    <div className="card tight" style={{boxShadow:'none'}}>
                                        {cand&&cand.payload&&cand.payload.candidates&&cand.payload.candidates.length>0&&(
                                            <>
                                                <div className="k" style={{marginBottom:8,color:'var(--ink-3)'}}>{cand.payload.count||cand.payload.candidates.length} eligible recovery actions</div>
                                                {cand.payload.candidates.map((c,i)=>(
                                                    <div key={i} style={{display:'flex',alignItems:'center',gap:12,padding:'7px 0'}}>
                                                        <div style={{flex:1}}>
                                                            <div style={{fontWeight:600,fontSize:13}}>{ACTION_LABELS[c.strategy]||c.strategy}
                                                                {(rank&&rank.payload&&rank.payload.selected===c.strategy)&&<span className="chip ok" style={{marginLeft:8}}>BEST</span>}</div>
                                                            <div style={{fontSize:11.5,color:'var(--ink-3)'}}>
                                                                {Math.round((c.probability||0)*100)}% probability
                                                                {c.empirical_attempts>0&&` · ${c.empirical_successes}/${c.empirical_attempts} historically recovered`}
                                                            </div>
                                                        </div>
                                                        <div style={{fontWeight:700}}>{fmt(c.expected_value)}</div>
                                                    </div>
                                                ))}
                                            </>
                                        )}
                                        {(pd||auditRow)&&(
                                            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingTop:10,borderTop:'1px solid var(--border)'}}>
                                                <div>
                                                    <div className="k" style={{color:'var(--ink-3)'}}>Selected</div>
                                                    <div style={{fontWeight:700,fontSize:15}}>{ACTION_LABELS[auditRow&&auditRow.action]||auditRow&&auditRow.action||(rank&&rank.payload&&rank.payload.selected)||'—'}</div>
                                                </div>
                                                <div className="right">
                                                    <div className="k" style={{color:'var(--ink-3)'}}>Expected recovery</div>
                                                    <div style={{fontWeight:700,fontSize:15,color:'var(--accent)'}}>{fmt(confSse&&confSse.payload?confSse.payload.amount:(ev?ev.recovered_amount:0))}</div>
                                                </div>
                                            </div>
                                        )}
                                        <div className="k" style={{color:'var(--ink-3)',marginTop:10}}>{rank&&rank.payload&&rank.payload.reason||pd&&pd.reason||(auditRow?'Highest expected recovery value among policy-eligible actions.':'')}</div>
                                    </div>
                                </div>
                            )}

                            <div className="drawer-sec"><h4>Policy</h4>
                                <div className={`verdict-box ${verdict?String(verdict).toLowerCase():'allow'}`}>
                                    <div style={{display:'flex',alignItems:'center',gap:10}}>
                                        <span className={`chip ${verdict==='ALLOW'?'ok':verdict==='DENY'?'bad':verdict==='MODIFY'?'warn':verdict==='HUMAN_REVIEW'?'warn':'ok'}`}>{verdict||'ALLOW'}</span>
                                        <span style={{fontSize:12.5,color:'var(--ink-2)'}}>{pd&&pd.reason||(policySse&&policySse.payload&&policySse.payload.reason)||''}</span>
                                    </div>
                                    {(checks.length>0||(pd&&pd.checks_failed&&pd.checks_failed.length))&&(
                                        <div style={{marginTop:12}}>
                                            {checks.map((c,i)=>(
                                                <div className="check-row" key={i}>
                                                    <span className={`check-mark ${c.result==='PASS'?'pass':'fail'}`}>{c.result==='PASS'?'✓':'✗'}</span>
                                                    <span className="check-rule">{c.rule}</span>
                                                    <span className="check-exp" style={{flex:1}}>{c.explanation}</span>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    {(ev||auditRow)&&(
                                        <div style={{marginTop:12,paddingTop:10,borderTop:'1px solid var(--border)',fontSize:12.5,color:'var(--ink-2)'}}>
                                            Execution: <b>{(()=>{const er=auditRow&&auditRow.execution_result?kv(auditRow.execution_result):null;return (er&&er.result)||(ev?'executed':'')})()}</b>
                                            {ev&&ev.recovered_amount>0&&<span style={{color:'var(--green)',fontWeight:700}}> · recovered {fmt(ev.recovered_amount)}</span>}
                                        </div>
                                    )}
                                </div>
                            </div>

                            {(specialist&&specialist.length>0)&&(
                                <div className="drawer-sec"><h4>Agent Trace</h4>
                                    <AgentTrace items={auditRow?specialist:specialist}/>
                                </div>
                            )}

                            {drawer.risk_flags&&drawer.risk_flags.length>0&&(
                                <div className="drawer-sec">
                                    <h4>Risk Flags</h4>
                                    {drawer.risk_flags.map((rf,i)=>(
                                        <div style={{display:'flex',gap:10,alignItems:'center',padding:'6px 0'}} key={i}>
                                            <span className={`chip ${rf.severity==='CRITICAL'||rf.severity==='HIGH'?'bad':'warn'}`}>{rf.code}</span>
                                            <span style={{fontSize:12.5,color:'var(--ink-2)'}}>{rf.message}</span>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </>
                    )}
                </div>
            </div>
        </>
    );
}

function buildSteps(drawer){
    const ev=drawer.event;
    const out=[];
    const push=(label,state,detail)=>out.push({label,state,detail});
    if(drawer.stages&&drawer.stages.length>0){
        // Real-time closed-loop: derive from SSE stage stream.
        const S=drawer.stages;
        const probe=(...types)=>S.find(s=>types.includes(s.type));
        const chk=(t)=>S.some(s=>s.type===t);
        const dpl=t=>{const s=probe(t);return s&&s.payload?s.payload:{}};
        push('Received','done','webhook ingress · HMAC verified');
        const diag=dpl('diagnosis.completed');
        push('Diagnosed',chk('diagnosis.completed')?'done':'wait',`${diag.classification||''} · ${diag.action_family||''}`.trim());
        push('Customer context loaded',chk('customer_context.completed')?'done':'wait','');
        const ranked=probe('strategy.ranked');
        push('Recovery optimized',chk('strategy.ranked')?'done':'wait',ranked&&ranked.payload?`elected ${ranked.payload.selected}`:'');
        const pol=probe('policy.evaluated');
        push('Policy evaluated',pol?(pol.payload&&pol.payload.verdict==='ALLOW'?'done':'fail'):'wait',pol&&pol.payload?`${pol.payload.verdict}${pol.payload.candidates_considered!=null?' · '+pol.payload.candidates_considered+' candidates before policy':''}`:'');
        if(chk('payment.confirmed'))push('Payment confirmed','done',`${fmt((probe('payment.confirmed').payload||{}).amount||0)} confirmed`);
        else if(chk('payment.pending'))push('Awaiting confirmation','wait','executed — waiting for trusted webhook confirmation');
        else if(chk('payment.failed'))push('Payment failed','fail','attempt failed — re-optimizing');
        else if(chk('recovery.blocked'))push('Blocked','fail',(probe('recovery.blocked').payload||{}).reason||'blocked by policy');
        else if(chk('human_review.required'))push('Human review','fail',(probe('human_review.required').payload||{}).reason||'escalated for human approval');
        return out;
    }
    if(!ev)return out;
    push('Received','done','');
    push('Diagnosed',ev.root_cause?'done':'wait',ev.root_cause||'');
    push('Customer context loaded','wait','');
    push('Recovery optimized','wait','');
    const auditRow=drawer.audit;
    const verdict=drawer.policy_decision&&drawer.policy_decision.verdict;
    push('Policy evaluated',verdict?(verdict==='ALLOW'?'done':'fail'):'wait',verdict||'');
    if(ev.status==='success')push('Payment confirmed','done',`recovered ${fmt(ev.recovered_amount)}`);
    else if(ev.status==='pending_webhook'||ev.status==='pending')push('Awaiting confirmation','wait','');
    else if(ev.status==='blocked')push('Blocked','fail',(drawer.policy_decision&&drawer.policy_decision.reason)||'blocked by policy');
    else if(ev.status==='human_review')push('Human review','fail','');
    else push('Processed','done',ev.status||'');
    return out;
}

function StepsList({steps,live}){
    return(
        <div>
            {steps.length===0&&<div className="empty">No steps recorded for this event.</div>}
            {steps.map((s,i)=>(
                <div className="step-row" key={i}>
                    <div className={`step-ico ${s.state==='done'?'done':s.state==='fail'?'fail':s.state==='active'?'active':'wait'}`}>
                        {s.state==='done'?'✓':s.state==='fail'?'×':live?(s.type||'').includes('payment')?'◷':'●':i+1}
                    </div>
                    <div className="step-body">
                        <div className="step-title">{live?(s.type||s.label||'').replace(/\./g,' '):s.label}</div>
                        <div className="step-detail">{live?s.detail||stageDetail(s):s.detail}</div>
                    </div>
                    {s.timestamp&&<div className="step-time">{timeOf(s.timestamp)}</div>}
                </div>
            ))}
        </div>
    );
}
function stageDetail(s){
    const p=s.payload||{};
    if(s.type==='policy.evaluated')return `${p.verdict||''}${p.reason?' · '+p.reason:''}`;
    if(s.type==='diagnosis.completed')return `${p.classification||''} · ${p.action_family||''}`;
    if(s.type==='strategy.ranked')return `elected ${p.selected||''}${p.reason?' · '+p.reason:''}`;
    if(s.type==='strategy.candidates_generated')return p.count!=null?`${p.count} candidates`:'';
    if(s.type==='payment.confirmed')return `confirmed ${fmt(p.amount)}`;
    if(s.type==='recovery.blocked'||s.type==='human_review.required')return p.reason||'';
    if(s.type==='execution.completed')return p.result||'';
    return '';
}

function AgentTrace({items}){
    const[open,setOpen]=useState(0);
    return(
        <div>
            {(items||[]).map((sc,i)=>{
                const name=sc.agent||sc.type||'agent';
                const openState=open===i||(open===0&&i===0&&items.length===1);
                return(
                    <div className="accordion" key={i}>
                        <div className="accordion-head" onClick={()=>setOpen(open===i?-1:i)}>
                            <span className={`check-mark ${i<items.length-1?'pass':'wait'}`}>{sc.output_summary?'✓':'·'}</span>
                            <span style={{textTransform:'capitalize'}}>{name.replace(/_/g,' ')}</span>
                            <span style={{marginLeft:'auto',color:'var(--ink-3)',fontSize:12}}>{openState?'−':'+'}</span>
                        </div>
                        {openState&&(
                            <div className="accordion-body">
                                {sc.input_summary&&<div style={{marginBottom:6}}><b style={{color:'var(--ink-3)'}}>IN</b> <span className="mono" style={{fontSize:11.5}}>{sc.input_summary}</span></div>}
                                {sc.output_summary&&<div><b style={{color:'var(--ink-3)'}}>OUT</b> <span className="mono" style={{fontSize:11.5}}>{sc.output_summary}</span></div>}
                            </div>
                        )}
                    </div>
                );
            })}
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
