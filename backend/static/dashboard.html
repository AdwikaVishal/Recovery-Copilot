<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recovery Copilot — AI Revenue Recovery</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root{
            --bg:#f7f8fa;
            --surface:#ffffff;
            --border:#e7e8ec;
            --border-strong:#d9dbe2;
            --ink:#1a1b22;
            --ink-2:#4b4e5a;
            --ink-3:#8a8d99;
            --accent:#2457f5;
            --accent-soft:#eef2fe;
            --green:#168a50;
            --green-soft:#e9f7f0;
            --red:#cc4037;
            --red-soft:#fdeceb;
            --amber:#b06c06;
            --amber-soft:#fdf3e2;
            --blue:#1a66d6;
            --blue-soft:#eaf2fd;
            --radius:14px;
            --radius-sm:9px;
            --shadow:0 1px 2px rgba(20,24,40,.05);
            --nav-w:232px;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
        ::selection{background:#2457f51f}

        .shell{display:flex;min-height:100vh}
        .nav{width:var(--nav-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px}
        .brand{display:flex;align-items:center;gap:11px;padding:2px 10px 20px}
        .mark{width:34px;height:34px;border-radius:9px;background:#0b1f3a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;letter-spacing:-.5px}
        .brand-name{font-size:15px;font-weight:700;letter-spacing:-.2px;line-height:1.15}
        .brand-sub{font-size:11px;color:var(--ink-3);font-weight:500;margin-top:1px}
        .nav-sec{font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-3);padding:14px 12px 6px}
        .nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;margin-bottom:2px;color:var(--ink-2);font-weight:500;font-size:13.5px;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background .12s,color .12s}
        .nav-item:hover{background:#f2f3f6}
        .nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
        .nav-item.active .avi{color:var(--accent)}
        .avi{width:17px;height:17px;color:var(--ink-3);flex-shrink:0}
        .nav-item .count{margin-left:auto;font-size:11px;color:var(--ink-3);background:#f0f1f4;border-radius:12px;padding:1px 8px;font-weight:600}
        .nav-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border);font-size:10.5px;color:var(--ink-3);line-height:1.5}

        .main{flex:1;min-width:0;max-width:1180px;margin:0 auto;padding:28px 34px 60px}
        .topbar{display:flex;align-items:center;gap:14px;margin-bottom:26px;flex-wrap:wrap}
        .page-title{font-size:24px;font-weight:700;letter-spacing:-.4px;line-height:1.2}
        .page-sub{font-size:13px;color:var(--ink-3);margin-top:4px}
        .spacer{flex:1}
        .badge{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid var(--border)}
        .badge .dot{width:7px;height:7px;border-radius:50%}
        .badge.live{color:var(--green);border-color:#cdebd9;background:var(--green-soft)}
        .badge.live .dot{background:var(--green);animation:pulse 1.6s ease-in-out infinite}
        .badge.warn{color:var(--amber);border-color:#f3ddb4;background:var(--amber-soft)}
        .badge.warn .dot{background:var(--amber)}
        .badge.neutral{color:var(--ink-2);background:var(--surface)}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

        .section{margin-bottom:30px}
        .section-title{font-size:16px;font-weight:700;letter-spacing:-.2px;margin-bottom:4px}
        .section-sub{font-size:12.5px;color:var(--ink-3);margin-bottom:16px}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px}
        .card.tight{padding:16px 18px}

        .hero-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
        .stat .k{font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.2px;text-transform:uppercase}
        .stat .v{font-size:30px;font-weight:700;letter-spacing:-.8px;margin-top:6px;line-height:1.05}
        .stat .s{font-size:12px;color:var(--ink-3);margin-top:6px}
        .accent-green .v{color:var(--green)}.accent-blue .v{color:var(--accent)}.accent-amber .v{color:var(--amber)}.accent-red .v{color:var(--red)}

        .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
        .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

        .impact{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:22px}
        .impact-col{text-align:center;padding:6px}
        .impact-col .lbl{font-size:12px;color:var(--ink-3);font-weight:600;margin-bottom:8px}
        .impact-col .big{font-size:34px;font-weight:700;letter-spacing:-1px}
        .impact-col.win .big{color:var(--green)}
        .impact-col.flat .big{color:var(--ink-2)}
        .impact-col .note{font-size:12px;color:var(--ink-3);margin-top:6px}
        .impact-divider{border-left:1px dashed var(--border-strong);height:88px}
        .impact-gain{display:flex;flex-direction:column;align-items:center;gap:2px;justify-self:center}
        .gain-num{font-size:20px;font-weight:700;color:var(--green)}
        .gain-lbl{font-size:12px;color:var(--ink-3)}

        .risk-row{display:flex;align-items:center;gap:14px;padding:10px 2px;border-bottom:1px solid var(--border)}
        .risk-row:last-child{border-bottom:none}
        .risk-name{width:200px;font-size:13px;font-weight:600;flex-shrink:0}
        .risk-bar{flex:1;height:8px;background:#eef0f3;border-radius:99px;overflow:hidden}
        .risk-bar i{display:block;height:100%;border-radius:99px;background:var(--accent);opacity:.85}
        .risk-meta{width:190px;text-align:right;font-size:12px;color:var(--ink-3);flex-shrink:0}
        .risk-meta b{color:var(--ink)}
        .risk-total{font-size:26px;font-weight:700;letter-spacing:-.6px;margin-bottom:14px}
        .risk-total small{display:block;font-size:12px;color:var(--ink-3);font-weight:500;letter-spacing:0;margin-top:3px}

        .funnel{display:flex;flex-direction:column;align-items:stretch;gap:0}
        .funnel-step{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border:1px solid var(--border);border-radius:10px;background:#fff}
        .funnel-step .fl{font-size:12.5px;color:var(--ink-3);font-weight:500}
        .funnel-step .fv{font-size:17px;font-weight:700}
        .funnel-arrow{display:flex;justify-content:center;color:var(--ink-3);padding:2px 0}
        .funnel-step.lg .fv{color:var(--green)}

        .live-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
        .live-strip .lcell .k{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
        .live-strip .lcell .v{font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.4px}

        table{width:100%;border-collapse:collapse;font-size:13px}
        th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-3);padding:8px 12px;border-bottom:1px solid var(--border-strong);white-space:nowrap}
        td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
        tbody tr{cursor:pointer;transition:background .1s}
        tbody tr:hover{background:#fafbff}
        tr:last-child td{border-bottom:none}
        .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
        .right{text-align:right}

        .chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
        .chip.ok{background:var(--green-soft);color:var(--green)}
        .chip.bad{background:var(--red-soft);color:var(--red)}
        .chip.warn{background:var(--amber-soft);color:var(--amber)}
        .chip.info{background:var(--blue-soft);color:var(--blue)}
        .chip.muted{background:#f1f2f5;color:var(--ink-2)}

        .btn{border:1px solid var(--border-strong);background:#fff;color:var(--ink);padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;transition:all .12s;display:inline-flex;align-items:center;gap:7px}
        .btn:hover{border-color:#c4c7d1;background:#fafbfc}
        .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
        .btn.primary:hover{background:#1d47d1}
        .btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding:6px 10px}
        .btn.ghost:hover{background:var(--accent-soft)}
        .btn:disabled{opacity:.5;cursor:not-allowed}
        .btn-row{display:flex;gap:10px;align-items:center}

        .input{width:100%;border:1px solid var(--border-strong);border-radius:9px;padding:9px 12px;font-size:13px;outline:none;background:#fff;color:var(--ink);transition:border .12s}
        .input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #2457f51a}
        .select{min-width:190px}
        .num{width:120px}

        .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
        .fbtn{padding:5px 13px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--border);background:#fff;color:var(--ink-2);cursor:pointer;transition:all .12s}
        .fbtn:hover{border-color:var(--border-strong)}
        .fbtn.on{background:#0b1f3a;border-color:#0b1f3a;color:#fff}

        .gcell{padding:14px;border:1px solid var(--border);border-radius:11px;cursor:pointer;transition:all .12s}
        .gcell:hover{border-color:var(--border-strong);box-shadow:var(--shadow)}
        .gcell .gn{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
        .gcell .gc{font-size:11.5px;color:var(--ink-3);margin-top:3px}

        .step-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);align-items:flex-start}
        .step-row:last-child{border-bottom:none}
        .step-ico{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700}
        .step-ico.done{background:var(--green-soft);color:var(--green)}
        .step-ico.wait{background:#f1f2f5;color:var(--ink-3)}
        .step-ico.fail{background:var(--red-soft);color:var(--red)}
        .step-ico.active{background:var(--blue-soft);color:var(--blue)}
        .step-body{flex:1;min-width:0}
        .step-title{font-size:13px;font-weight:600}
        .step-detail{font-size:12px;color:var(--ink-3);margin-top:3px}
        .step-time{font-size:11px;color:var(--ink-3);white-space:nowrap;margin-top:2px}

        .trace-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
        .trace-tab{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--ink-2);transition:all .12s}
        .trace-tab.active{background:#0b1f3a;border-color:#0b1f3a;color:#fff}

        .check-row{display:flex;gap:10px;padding:7px 0;font-size:12.5px;align-items:flex-start}
        .check-mark{flex-shrink:0;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:1px}
        .check-mark.pass{background:var(--green-soft);color:var(--green)}
        .check-mark.fail{background:var(--red-soft);color:var(--red)}
        .check-rule{font-weight:600;min-width:150px}
        .check-exp{color:var(--ink-3)}

        .verdict-box{border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;margin-top:14px}
        .verdict-box.allow{border-left-color:var(--green)}.verdict-box.deny{border-left-color:var(--red)}.verdict-box.modify{border-left-color:var(--amber)}.verdict-box.human{border-left-color:var(--amber)}

        .answer{background:#f7f9fd;border:1px solid #dbe6fb;border-radius:10px;padding:13px 16px;font-size:13px;color:var(--ink-2);margin-bottom:14px;line-height:1.55}
        .answer b{color:var(--accent)}

        .accordion{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden}
        .accordion-head{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;font-size:13px;font-weight:600}
        .accordion-head:hover{background:#fafbfc}
        .accordion-body{border-top:1px solid var(--border);padding:14px;background:#fcfcfd;font-size:12.5px}

        .stream-item{display:flex;align-items:center;gap:12px;padding:8px 2px;border-bottom:1px solid var(--border);font-size:12.5px}
        .stream-item:last-child{border-bottom:none}
        .stream-t{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-3);width:66px;flex-shrink:0}
        .stream-type{font-weight:600;color:var(--ink);width:210px;flex-shrink:0}
        .stream-detail{color:var(--ink-3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

        .empty{text-align:center;padding:36px 20px;color:var(--ink-3);font-size:13px;line-height:1.6}
        .empty .eico{font-size:30px;margin-bottom:8px}
        .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
        .kpi{padding:12px 14px;border:1px solid var(--border);border-radius:10px}
        .kpi .k{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
        .kpi .v{font-size:18px;font-weight:700;margin-top:3px}

        .drawer-backdrop{position:fixed;inset:0;background:rgba(12,16,32,.34);z-index:40;animation:fade .18s ease}
        .drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:#fff;z-index:41;box-shadow:-12px 0 40px rgba(12,16,32,.14);display:flex;flex-direction:column;animation:slide .22s ease}
        @keyframes fade{from{opacity:0}to{opacity:1}}
        @keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
        .drawer-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:14px}
        .drawer-head .dh-id{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink-3);margin-top:4px}
        .drawer-head .dh-amt{font-size:22px;font-weight:700;margin-top:6px;letter-spacing:-.4px}
        .drawer-body{flex:1;overflow-y:auto;padding:6px 24px 30px}
        .drawer-sec{margin-top:22px}
        .drawer-sec h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3);margin-bottom:10px}
        .drawer-close{margin-left:auto;border:1px solid var(--border);background:#fff;color:var(--ink-2);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:15px;flex-shrink:0;transition:all .12s}
        .drawer-close:hover{border-color:var(--border-strong);background:#f6f7f9}

        /* system health */
        .health-wrap{position:relative;display:inline-flex}
        .health-wrap>.badge{cursor:pointer}
        .health-pop{position:absolute;right:0;top:calc(100% + 10px);width:296px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 40px rgba(20,24,40,.14);padding:8px;z-index:60}
        .health-pop:before{content:'';position:absolute;top:-5px;right:30px;width:10px;height:10px;background:var(--surface);border-left:1px solid var(--border);border-top:1px solid var(--border);transform:rotate(45deg)}
        .health-row{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px}
        .health-row:hover{background:#f7f8fa}
        .health-right{margin-left:auto;text-align:right}
        .health-right .hr-st{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.4px}
        .health-right .hr-st.up{color:var(--green)}.health-right .hr-st.dn{color:var(--red)}
        .health-right .hr-dt{font-size:10.5px;color:var(--ink-3);margin-top:1px}
        .hdot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex-shrink:0}
        .hdot.up{background:var(--green)}.hdot.dn{background:var(--red)}

        /* pipeline stepper */
        .stepper{display:flex;align-items:flex-start;overflow-x:auto;padding:10px 2px 4px}
        .pstep{flex:1;display:flex;flex-direction:column;align-items:center;min-width:78px;max-width:120px;position:relative}
        .pstep .sc{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:1.5px solid var(--border-strong);background:#fff;color:var(--ink-3);z-index:1;transition:all .15s}
        .pstep.done .sc{background:var(--green-soft);border-color:#b3e3c6;color:var(--green)}
        .pstep.act .sc{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 4px #1a66d61c}
        .pstep.fail .sc{background:var(--red-soft);border-color:#f2c3c0;color:var(--red)}
        .pstep .sl{font-size:9.5px;font-weight:700;color:var(--ink-3);margin-top:6px;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
        .pstep.done .sl{color:var(--green)}.pstep.act .sl{color:var(--blue)}.pstep.fail .sl{color:var(--red)}
        .pstep .ln{position:absolute;top:15px;right:50%;width:100%;height:2px;background:var(--border-strong);z-index:0}
        .pstep:first-child .ln{display:none}
        .pstep.done .ln{background:#a9ddc0}
        .pstep.act .ln{background:#a9ddc0}

        /* AI decision card */
        .dec-card{border:1px solid var(--border);border-radius:12px;overflow:hidden}
        .dec-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);background:#fafbfc}
        .dec-head .dt{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.3px;text-transform:uppercase}
        .dec-head .damt{font-size:21px;font-weight:700;letter-spacing:-.5px}
        .dec-body{padding:2px 16px}
        .dec-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
        .dec-row:last-child{border-bottom:none}
        .dec-row .dk{color:var(--ink-3);font-size:12px}
        .dec-row .dv{font-weight:600}
        .dec-why{padding:11px 16px;background:#f7f9fd;border-top:1px solid var(--border);font-size:12.5px;color:var(--ink-2);line-height:1.65}
        .dec-why b{color:var(--accent)}
        .dec-cands{padding:0 16px 12px;border-top:1px dashed var(--border)}
        .cand-row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;border:1px solid transparent;font-size:12.5px}
        .cand-row:nth-child(2){margin-top:6px}
        .cand-row.elected{background:var(--blue-soft);border-color:#bcd3f6}
        .cand-strategy{font-weight:600;color:var(--ink-2)}
        .cand-meta{margin-left:auto;display:flex;align-items:center;gap:10px}
        .cand-p{font-weight:700;color:var(--ink-2)}
        .cand-ev{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
        .cand-pick{font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--blue);border:1px solid var(--blue);border-radius:99px;padding:1px 7px}
        .dec-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--green-soft);border-top:1px solid #cdebd9}
        .dec-foot .fv{font-size:19px;font-weight:700;color:var(--green)}
        .dec-foot.pending{background:var(--amber-soft);border-top-color:#f3ddb4}
        .dec-foot.pending .fv{color:var(--amber)}
        .dec-foot.blocked{background:var(--red-soft);border-top-color:#f2c3c0}
        .dec-foot.blocked .fv{color:var(--red)}

        /* transaction trace drawer */
        .trace-banner{display:flex;align-items:center;gap:12px;padding:13px 16px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
        .trace-banner .tb-r{margin-left:auto;font-weight:700;white-space:nowrap}
        .trace-banner.ok{background:var(--green-soft);border-top:2px solid var(--green)}
        .trace-banner.wait{background:var(--amber-soft);border-top:2px solid var(--amber)}
        .trace-banner.no{background:var(--red-soft);border-top:2px solid var(--red)}
        .trace-banner.ok .tb-r{color:var(--green)}
        .trace-banner.wait .tb-r{color:var(--amber)}
        .trace-banner.no .tb-r{color:var(--red)}
        .why-box{background:#f7f9fd;border:1px solid var(--border);border-radius:12px;padding:14px 16px;font-size:12.5px;line-height:1.8;color:var(--ink-2)}
        .why-box b{color:var(--accent)}
        .why-box .wh{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}

        /* empty state with CTA */
        .cta-empty{text-align:center;padding:44px 26px;border:1px dashed var(--border-strong);border-radius:12px;background:#fcfcfd}
        .cta-empty .eico{font-size:34px;margin-bottom:10px}
        .cta-empty .et{font-size:16px;font-weight:700}
        .cta-empty .es{font-size:13px;color:var(--ink-3);margin:6px auto 18px;max-width:480px;line-height:1.65}
        .cta-empty .mono{color:var(--ink-2)}

        /* policy gate */
        .gate-wrap{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
        .gate-score{width:110px;height:110px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--green-soft);border:3px solid var(--green);flex-shrink:0}
        .gate-score .gv{font-size:26px;font-weight:700;color:var(--green);letter-spacing:-1px}
        .gate-score .gl{font-size:10px;color:var(--green);font-weight:700;letter-spacing:.6px;text-transform:uppercase}
        .gate-tally{display:flex;gap:10px;flex-wrap:wrap;flex:1;min-width:260px}
        .gate-tile{flex:1;min-width:110px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;text-align:center}
        .gate-tile .k{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3)}
        .gate-tile .v{font-size:21px;font-weight:700;margin-top:3px}
        .gate-tile.ok .v{color:var(--green)}.gate-tile.warn .v{color:var(--amber)}.gate-tile.bad .v{color:var(--red)}

        /* benchmark comparison */
        .bm-cmp{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:26px}
        .bm-col{text-align:center}
        .bm-col .lbl{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.4px;text-transform:uppercase;margin-bottom:8px}
        .bm-col .big{font-size:38px;font-weight:700;letter-spacing:-1.2px}
        .bm-col.flat .big{color:var(--ink-2)}
        .bm-col.win .big{color:var(--green)}
        .bm-col .note{font-size:12px;color:var(--ink-3);margin-top:6px}
        .bm-vs{color:var(--ink-3);font-weight:700;font-size:15px}
        .bm-gain{display:flex;flex-direction:column;align-items:center;gap:1px;padding-left:22px;border-left:1px solid var(--border-strong)}
        .bm-gain .gn{font-size:19px;font-weight:700;color:var(--green)}
        .bm-gain .gl{font-size:11px;color:var(--ink-3);font-weight:600}

        @media(max-width:1020px){
            .hero-row{grid-template-columns:repeat(2,1fr)}
            .live-strip{grid-template-columns:repeat(3,1fr)}
            .grid2,.grid3{grid-template-columns:1fr 1fr}
            .nav{width:200px}
        }
        @media(max-width:760px){
            .shell{flex-direction:column}
            .nav{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px 14px}
            .brand{display:none}.nav-foot{display:none}
            .nav-item{white-space:nowrap;width:auto}
            .nav-sec{display:none}
            .main{padding:20px 18px}
            .grid2,.grid3{grid-template-columns:1fr}
            .hero-row,.live-strip{grid-template-columns:1fr 1fr}
            .impact{grid-template-columns:1fr;gap:14px}
            .impact-divider{border-left:none;border-top:1px dashed var(--border-strong);width:100%;height:0}
            .risk-name{width:110px}.risk-meta{width:120px}
            .drawer{width:100vw}
        }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;
const API=window.__API_URL__||'';

const fmt=p=>`₹${Math.round((p||0)/100).toLocaleString('en-IN')}`;
const fmtL=p=>{const rs=Math.round((p||0)/100);return rs>=100000?`₹${(rs/100000).toFixed(2)}L`:`₹${rs.toLocaleString('en-IN')}`};
const pct=(n,d)=>d>0?((n/d)*100).toFixed(1):'0';
const timeOf=ts=>ts?(String(ts).split('T')[1]||ts).slice(0,8):'';
const kv=p=>{try{return JSON.parse(p)}catch(e){return p}};

const TYPE_LABELS={card_payment_failure:'Card Payment Failure',recurring_payment_failure:'Recurring Payment Failure',checkout_abandonment:'Checkout Abandonment',overdue_invoice:'Overdue Receivable'};
const ACTION_LABELS={retry_payment:'Retry Payment',send_payment_link:'Payment Link',re_authorize_mandate:'Mandate Re-auth',send_dunning_message:'Payment Reminder',escalate_to_human:'Escalated to Human',blocked:'Blocked by Policy',none:'—'};

function icon(name){const p=n=>`<path d="${n}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
    const d={
        overview:'M3 12 12 4l9 8M5 10v10h5v-6h4v6h5V10',
        live:'M13 10V3L4 14h7v7l9-11h-7z',
        transactions:'M3 6h18M3 12h18M3 18h18',
        benchmark:'M4 20V10m6 10V4m6 16v-8m4 8H2',
        guardrails:'M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4zm0 6v4m0 3v.01',
        audit:'M8 3h8l4 4v14H8V3zm0 0v4h4m-3 6h6m-6 4h6m-6-8h2',
        evaluation:'M9 12l2 2 4-4m3-9H4v19h14V1z',
        model:'M12 3l8 4v10l-8 4-8-4V7l8-4zm0 2.2L6 8v8l6 3 6-3V8l-6-2.8zM12 8l3 1.5v3L12 14l-3-1.5v-3L12 8z'
    }[name]||'M4 6h16M4 12h16M4 18h16';
    return `<svg class="avi" viewBox="0 0 24 24">${p(d)}</svg>`;
}

const liveStageTypes=['event.received','event.normalized','agent.started','agent.completed','diagnosis.completed','customer_context.completed','strategy.candidates_generated','strategy.ranked','policy.evaluated','execution.started','execution.completed','payment.pending','payment.confirmed','payment.failed','recovery.completed','recovery.blocked','human_review.required','event.completed'];

const NAV=[['overview','Overview','overview'],['live','Live Recovery','live'],['transactions','Transactions','transactions'],['benchmark','Benchmark','benchmark'],['guardrails','Guardrails','guardrails'],['audit','Audit Trail','audit'],['evaluation','Evaluation','evaluation'],['model','Recovery AI','model']];

function App(){
    const[page,setPage]=useState('overview');
    const[hero,setHero]=useState(null);
    const[audit,setAudit]=useState(null);
    const[guardrails,setGuardrails]=useState(null);
    const[safety,setSafety]=useState(null);
    const[interventions,setInterventions]=useState(null);
    const[channelData,setChannelData]=useState(null);
    const[gtTraces,setGtTraces]=useState(null);
    const[auditVerify,setAuditVerify]=useState(null);
    const[lm,setLm]=useState(null);
    const[sse,setSse]=useState('connecting');
    const[flow,setFlow]=useState([]);
    const[txns,setTxns]=useState([]);
    const[drawer,setDrawer]=useState(null);
    const[evalRes,setEvalRes]=useState(null);
    const[evalBusy,setEvalBusy]=useState(false);
    const[sizeNote,setSizeNote]=useState(null);

    const flowRef=useRef([]);const txnRef=useRef([]);
    const timer=useRef(null);
    const maybeEval=useRef({});
    const loaded=useRef({});

    const get=async p=>{const r=await fetch(API+p);if(!r.ok)throw new Error(p);return r.json()};

    const loadHero=useCallback(async()=>{try{setHero(await get('/api/dashboard/hero'))}catch(e){}},[]);
    const loadLive=useCallback(async()=>{try{setLm(await get('/api/live/metrics'))}catch(e){}},[]);

    // Debounced light refresh (metrics + hero) after live activity — avoids the old
    // behaviour of refetching everything on every SSE frame.
    const scheduleRefresh=useCallback(()=>{
        if(timer.current)clearTimeout(timer.current);
        timer.current=setTimeout(()=>{loadLive();loadHero();},1200);
    },[loadLive,loadHero]);

    const loadPageData=useCallback(async(pageName)=>{
        const flags=loaded.current;
        if(!flags.core){
            flags.core=true;
            loadHero();
            setAudit(await get('/api/audit').catch(()=>[]));
            setGuardrails(await get('/api/guardrails/expanded').catch(()=>null));
            setSafety(await get('/api/safety-metrics').catch(()=>null));
            setInterventions(await get('/api/interventions').catch(()=>[]));
            setChannelData(await get('/api/channel-effectiveness').catch(()=>[]));
        }
        if(pageName==='benchmark'&&!flags.benchmark){flags.benchmark=true;}
        if(pageName==='guardrails'&&!flags.guardrails){
            flags.guardrails=true;
            setGtTraces(await get('/api/guardrail-trace').then(r=>r.traces).catch(()=>null));
            setAuditVerify(await get('/api/audit/verify').catch(()=>null));
        }
        if(pageName==='evaluation'&&!flags.evaluation){flags.evaluation=true;runEval();}
    },[loadHero]);

    useEffect(()=>{loadPageData(page)},[page,loadPageData]);

    useEffect(()=>{
        if(loaded.current.dtor)return;loaded.current.dtor=true;
        const es=new EventSource(`${API}/api/events/stream`);
        es.onopen=()=>setSse('live');
        es.onerror=()=>setSse('reconnecting');
        es.onmessage=e=>{
            let d;try{d=JSON.parse(e.data)}catch(err){return}
            if(d.type==='connected')return;
            if(d.type==='transaction.updated'){
                txnRef.current=[d,...txnRef.current].slice(0,40);
                setTxns(txnRef.current);
                scheduleRefresh();
                return;
            }
            if(liveStageTypes.includes(d.type)){
                // terminal bookends
                if(['payment.confirmed','payment.failed','payment.pending','recovery.blocked','human_review.required'].includes(d.type)){
                    const key=d.transaction_id||d.correlation_id||d.event_id;
                    const ex=flowRef.current.find(s=>s.transaction_id===key||s.correlation_id===key);
                    txnRef.current=[...txnRef.current.filter(t=>t.txn!==key)]; // placeholder entries only
                }
                flowRef.current=[d,...flowRef.current].slice(0,200);
                setFlow(flowRef.current);
                if(['payment.confirmed','payment.failed','recovery.blocked','human_review.required','event.completed'].includes(d.type)){
                    scheduleRefresh();
                }
            }
        };
        return()=>es.close();
    },[scheduleRefresh]);

    const runBatch=async()=>{
        try{await fetch(API+'/api/batch/run',{method:'POST'})}catch(e){}
        await Promise.all([loadHero(),loadLive()]);
        setAudit(await get('/api/audit').catch(()=>[]));
        setSizeNote('Benchmark replayed — numbers are deterministic.');
        setTimeout(()=>setSizeNote(null),4000);
    };
    const runEval=async()=>{
        if(evalBusy)return;setEvalBusy(true);setEvalRes(null);
        try{setEvalRes(await fetch(API+'/api/evaluation/scenarios',{method:'POST'}).then(r=>r.json()))}
        catch(e){setEvalRes({error:'Evaluation endpoint unavailable.'})}
        setEvalBusy(false);
    };
    const openDrawer=async(id,stages)=>{
        if(typeof id!=='string'||!id)return;
        setDrawer({id,stages:stages||[],loading:true});
        try{const t=await get(`/api/transaction/${encodeURIComponent(id)}/trace`);setDrawer(prev=>prev&&prev.id===id?{id,stages:stages||[],...t,loading:false}:prev)}
        catch(e){setDrawer(prev=>prev&&prev.id===id?{id,stages:stages||[],notFound:true,loading:false}:prev)}
    };

    return(
        <div className="shell">
            <div className="nav">
                <div className="brand">
                    <div className="mark">RC</div>
                    <div>
                        <div className="brand-name">Recovery Copilot</div>
                        <div className="brand-sub">AI Revenue Recovery</div>
                    </div>
                </div>
                <div className="nav-sec">Workspace</div>
                {NAV.map(([id,label])=>(
                    <button key={id} className={`nav-item ${page===id?'active':''}`} onClick={()=>setPage(id)}
                        dangerouslySetInnerHTML={{__html:`${icon(id)}<span>${label}</span>`}}/>
                ))}
                <div className="nav-foot">Synthetic, deterministic data.<br/>Webhook ingress: HMAC-signed.<br/>Policy boundary enforced.</div>
            </div>

            <main className="main">
                <TopBar page={page} setPage={setPage} sse={sse}/>
                {sizeNote&&<div className="answer" style={{marginBottom:16}}><b>Done.</b> {sizeNote}</div>}
                {page==='overview'&&<Overview hero={hero} lm={lm} safety={safety} guardrails={guardrails} interventions={interventions} flow={flow} txns={txns} audit={audit} openDrawer={openDrawer} go={setPage} runBatch={runBatch}/>}
                {page==='live'&&<LivePage lm={lm} flow={flow} txns={txns} sse={sse} openDrawer={openDrawer} loadLive={loadLive}/>}
                {page==='transactions'&&<Transactions audit={audit} openDrawer={openDrawer}/>}
                {page==='benchmark'&&<Benchmark hero={hero} interventions={interventions} channelData={channelData} runBatch={runBatch}/>}
                {page==='guardrails'&&<Guardrails guardrails={guardrails} safety={safety} traces={gtTraces} verify={auditVerify} openDrawer={openDrawer}/>}
                {page==='audit'&&<Audit audit={audit} verify={auditVerify} openDrawer={openDrawer}/>}
                {page==='evaluation'&&<Evaluation res={evalRes} busy={evalBusy} run={runEval}/>}
                {page==='model'&&<RecoveryAi/>}
            </main>

            {drawer&&<TransactionDrawer drawer={drawer} close={()=>setDrawer(null)}/>}
        </div>
    );
}

function TopBar({page,sse}){
    const titles={overview:['Overview','Monitor revenue at risk and recover it — safely.'],live:['Live Recovery','Streaming ML → AI → Policy → Action → Outcome in real time.'],transactions:['Transactions','Investigate why each transaction got this decision.'],benchmark:['Benchmark','Did we actually make money?'],guardrails:['Guardrails','Ten enforced controls bound every action.'],audit:['Audit Trail','Provable, tamper-evident record of every decision.'],evaluation:['Evaluation','Does the system do what we promised?'],model:['Recovery AI','Frozen ExtraTrees model — 44 features → calibrated ML recovery probability → AI action success probability.']};
    const[t,sub]=titles[page]||['',''];
    return(
        <div className="topbar">
            <div>
                <div className="page-title">{t}</div>
                <div className="page-sub">{sub}</div>
            </div>
            <div className="spacer"></div>
            <span className="badge neutral">Demo · synthetic data</span>
            <SystemHealth/>
        </div>
    );
}

function SystemHealth(){
    const[st,setSt]=useState(null);
    const[open,setOpen]=useState(false);
    useEffect(()=>{
        let on=true;
        const f=async()=>{
            try{const r=await fetch(API+'/api/system/status');if(!r.ok)throw 0;const j=await r.json();if(on)setSt(j)}
            catch(e){if(on)setSt({status:'error',components:[{name:'api',ok:false,detail:'unreachable'},{name:'database',ok:false,detail:'unreachable'},{name:'webhook',ok:false,detail:'unreachable'},{name:'sse',ok:false,detail:'unreachable'},{name:'policy_engine',ok:false,detail:'unreachable'}]})}
        };
        f();const t=setInterval(f,15000);
        return()=>{on=false;clearInterval(t)};
    },[]);
    const ok=!st||st.status==='ok';
    const deg=st?st.components.filter(c=>!c.ok):[];
    const label=!st?'CHECKING…':ok?'ALL SYSTEMS OPERATIONAL':`${deg.length} ${deg.length===1?'SYSTEM':'SYSTEMS'} DEGRADED`;
    return(
        <div className="health-wrap">
            <span className={`badge ${ok?'live':'warn'}`} onClick={()=>setOpen(!open)} title="System health — click for components">
                <span className="dot"></span>{label}{st&&<span style={{marginLeft:6,fontSize:10}}>{open?'▲':'▼'}</span>}
            </span>
            {open&&st&&(
                <div className="health-pop">
                    {st.components.map(c=>(
                        <div className="health-row" key={c.name}>
                            <span className={`hdot ${c.ok?'up':'dn'}`}></span>
                            <span style={{fontSize:12.5,fontWeight:600,textTransform:'uppercase',letterSpacing:.3,color:'var(--ink-2)'}}>{c.name==='policy_engine'?'POLICY ENGINE':c.name}</span>
                            <div className="health-right">
                                <span className={`hr-st ${c.ok?'up':'dn'}`}>{c.ok?'UP':'DOWN'}</span>
                                <div className="hr-dt">{c.detail}</div>
                            </div>
                        </div>
                    ))}
                    <div style={{fontSize:10.5,color:'var(--ink-3)',padding:'6px 10px 2px',borderTop:'1px solid var(--border)',marginTop:6}}>
                        {st.status==='ok'?'All services nominal · HMAC ingress verified · 10-rule policy gate':'At least one component needs attention.'}
                    </div>
                </div>
            )}
        </div>
    );
}

function Spinner(){return <div className="empty"><div className="eico">◌</div>Loading data…</div>}

function H({title,sub,right}){return(
    <div style={{display:'flex',alignItems:'flex-end',gap:12,marginBottom:14}}>
        <div style={{minWidth:0}}>
            <div className="section-title">{title}</div>
            {sub&&<div className="section-sub" style={{marginBottom:0}}>{sub}</div>}
        </div>
        <div className="spacer"></div>
        {right}
    </div>
)}

/* ---------------- OVERVIEW ---------------- */
function Overview({hero,lm,safety,guardrails,interventions,flow,txns,audit,openDrawer,go,runBatch}){
    if(!hero)return <Spinner/>;
    const b=hero;
    const atRiskTotal=b.categories.reduce((s,c)=>s+c.at_risk,0);
    const actionsExec=interventions?interventions.reduce((s,iv)=>s+iv.count,0):0;
    const stopped=(b.batch_blocked||0)+(b.batch_human_review||0);
    const unsafe=(safety?((safety.afa_violations||0)+(safety.opt_out_violations||0)+(safety.excess_retries||0)):0);

    return(
        <div>
            <div className="hero-row">
                <div className="card tight stat">
                    <div className="k">Confirmed Revenue Recovered</div>
                    <div className="v">{fmt(b.batch_recovered_amount)}</div>
                    <div className="s">{b.batch_recovered_count} of {b.batch_count} events confirmed</div>
                </div>
                <div className="card tight stat">
                    <div className="k">Incremental</div>
                    <div className="v accent-green">+{fmt(b.batch_incremental)}</div>
                    <div className="s">+{b.batch_uplift}% uplift vs do-nothing</div>
                </div>
                <div className="card tight stat">
                    <div className="k">Recovery Rate</div>
                    <div className="v">{pct(b.batch_recovered_count,b.batch_count)}%</div>
                    <div className="s">{b.batch_recovered_count} of {b.batch_count} at-risk events</div>
                </div>
                <div className="card tight stat">
                    <div className="k">Stopped Safely</div>
                    <div className="v accent-amber">{stopped}</div>
                    <div className="s">{b.batch_blocked} blocked · {b.batch_human_review} human review</div>
                </div>
</div>

        <LatestDecision flow={flow} audit={audit} runBatch={runBatch} go={go}/>

        <div className="section">
            <H title="Business Impact" sub="Benchmark — 100 deterministic events"/>
                <div className="card">
                    <div className="impact">
                        <div className="impact-col flat">
                            <div className="lbl">DO NOTHING</div>
                            <div className="big">{fmt(b.batch_baseline_amount)}</div>
                            <div className="note">Counterfactual baseline · no AI recovery</div>
                        </div>
                        <div className="impact-divider"></div>
                        <div className="impact-col win">
                            <div className="lbl">RECOVERY COPILOT</div>
                            <div className="big">{fmt(b.batch_recovered_amount)}</div>
                            <div className="note">Multi-agent pipeline + policy guardrails</div>
                        </div>
                    </div>
                    <div style={{display:'flex',justifyContent:'center',gap:22,marginTop:18,paddingTop:16,borderTop:'1px dashed var(--border-strong)'}}>
                        <div className="gain-num">+{fmt(b.batch_incremental)} <span style={{fontSize:12,fontWeight:600,color:'var(--ink-3)'}}>incremental</span></div>
                        <div className="gain-num">+{b.batch_uplift}% <span style={{fontSize:12,fontWeight:600,color:'var(--ink-3)'}}>uplift</span></div>
                        <div className="k" style={{alignSelf:'center',color:'var(--ink-3)'}}>vs do-nothing baseline</div>
                    </div>
                </div>
            </div>

            <div className="section grid2">
                <div>
                    <H title="Revenue at Risk" sub="Batch · by event category"/>
                    <div className="card" style={{height:'100%'}}>
                        <div className="risk-total">{fmt(atRiskTotal)}<small>total revenue at risk across below categories</small></div>
                        {[...b.categories].sort((a,c)=>c.at_risk-a.at_risk).map(c=>{
                            const m=Math.max(...b.categories.map(x=>x.at_risk));
                            return(
                                <div className="risk-row" key={c.type}>
                                    <div className="risk-name">{c.label}</div>
                                    <div className="risk-bar"><i style={{width:`${Math.max((c.at_risk/m)*100,2)}%`}}></i></div>
                                    <div className="risk-meta"><b>{fmtL(c.at_risk)}</b> · {c.events} events</div>
                                </div>
                            );
                        })}
                    </div>
                </div>
                <div>
                    <H title="Recovery Funnel" sub="From at-risk to confirmed"/>
                    <div className="card" style={{height:'100%'}}>
                        <div className="funnel">
                            <div className="funnel-step"><span className="fl">At-risk events</span><span className="fv">{b.batch_count}</span></div>
                            <div className="funnel-arrow"><Ico arrow/></div>
                            <div className="funnel-step"><span className="fl">Recovery attempts</span><span className="fv">{actionsExec}</span></div>
                            <div className="funnel-arrow"><Ico arrow/></div>
                            <div className="funnel-step"><span className="fl">Payments confirmed</span><span className="fv">{b.batch_recovered_count}</span></div>
                            <div className="funnel-arrow"><Ico arrow/></div>
                            <div className="funnel-step lg"><span className="fl">Confirmed revenue recovered</span><span className="fv">{fmt(b.batch_recovered_amount)}</span></div>
                        </div>
                    </div>
                </div>
            </div>

            <div className="section">
                <H title="Live Recovery" sub="Streaming over SSE — no page refresh" right={<button className="btn ghost" onClick={()=>go('live')}>Open Live Recovery →</button>}/>
                <LivePanel lm={lm} flow={flow} txns={txns} compact openDrawer={openDrawer}/>
            </div>

            <div className="section">
                <H title="Recovery Safety" sub="Policy engine is the hard boundary — the AI proposes, policy disposes"/>
                <div className="card">
                    <div style={{display:'flex',flexWrap:'wrap',alignItems:'center',gap:26}}>
                        <div>
                            <div style={{fontSize:30,fontWeight:700,letterSpacing:-.6}}>{guardrails&&guardrails.checks?guardrails.checks.length:10}<span style={{fontSize:14,color:'var(--ink-3)',fontWeight:600}}> policy rules</span></div>
                            <div style={{fontSize:12.5,color:'var(--ink-3)',marginTop:3}}>enforced on every candidate action</div>
                        </div>
                        <div style={{width:1,height:52,background:'var(--border)'}}></div>
                        <div>

/* ---------------- AI DECISION + PIPELINE (shared) ---------------- */
function grpPayload(g,type){const s=(g.stages||[]).find(x=>x.type===type);return s&&s.payload?s.payload:null}

function normLiveDecision(g){
    const diag=grpPayload(g,'diagnosis.completed');
    const rank=grpPayload(g,'strategy.ranked');
    const cand=grpPayload(g,'strategy.candidates_generated');
    const pol=grpPayload(g,'policy.evaluated');
    const conf=grpPayload(g,'payment.confirmed');
    const ctx=grpPayload(g,'customer_context.completed');
    const selected=rank&&rank.selected;
    // Ranked candidate list (prob + EV) when available; fall back to the
    // generation-order list. Ranked order is the optimizer's EV ordering.
    const rankedList=(rank&&rank.ranked)||(cand&&cand.candidates)||[];
    const cp=(cand&&cand.candidates||[]).find(c=>c.strategy===selected)||null;
    return {
        live:true, label:TYPE_LABELS[g.type]||(g.type||'').replace(/_/g,' '), amount:g.amount||0, id:g.key,
        diagnosis:diag&&diag.classification, confidence:diag&&diag.confidence, actionFamily:diag&&diag.action_family,
        action:selected, probability:cp?cp.probability:null, probability_source:cp?cp.probability_source:null,
        model_version:cp?cp.model_version:null, expected_value:cp?cp.expected_value:null,
        reasons:rank&&rank.reason, candidates:rankedList, selected,
        verdict:pol&&pol.verdict, policyReason:pol&&pol.reason,
        status:g.status, confirmed:conf&&conf.payload?conf.payload.amount:0, recovered:0,
        checks:[], safeToContact:ctx&&(ctx.safe_to_contact===true), optIn:ctx&&ctx.consent,
    };
}

function normTraceDecision(t){
    const ev=t.event||{}, au=t.audit||{}, pd=t.policy_decision||null;
    const sc=t.specialist_calls||[];
    const out=a=>{const c=sc.find(x=>x.agent===a);return c?(c.output_summary||''):''};
    const cls=/classification=([^,]+)/.exec(out('diagnosis_agent'));
    const evM=/ev=₹([\d,.]+)/.exec(out('recovery_optimizer'));
    return {
        live:false, label:TYPE_LABELS[ev.type]||(ev.type||'').replace(/_/g,' '), amount:ev.amount||au.amount_attempted||0,
        id:ev.id||au.event_id||'—', diagnosis:cls?cls[1]:(ev.root_cause||''), confidence:au.diagnosis_confidence||null,
        action:ACTION_LABELS[au.action]||au.action||'—', probability:null,
        expected_value:evM?Math.round(parseFloat(evM[1].replace(/,/g,''))*100):null,
        reasons:au.reason||'', candidates:[],
        verdict:pd&&pd.verdict, policyReason:(pd&&pd.reason)||au.reason,
        status:ev.status||au.workflow_status||'pending',
        confirmed:0, recovered:ev.recovered_amount||0,
        checks:pd&&pd.detailed_results||[], safeToContact:true, optIn:null,
    };
}

const PIPELINE=[['EVENT','event.received'],['DIAGNOSE','diagnosis.completed'],['CONTEXT','customer_context.completed'],['ML','ml.prediction'],['STRATEGY','strategy.candidates_generated'],['OPTIMIZE','strategy.ranked'],['POLICY','policy.evaluated'],['EXECUTE','execution.started'],['CONFIRM','payment.confirmed']];

function PipelineStepper({group}){
    if(!group||!(group.stages||[]).length)return null;
    const S=group.stages;
    const has=t=>S.some(s=>s.type===t);
    const terminalOK=has('payment.confirmed');
    const terminalFail=has('payment.failed')||has('recovery.blocked')||has('human_review.required');
    const lastIdx=PIPELINE.reduce((m,[,t],i)=>has(t)?i:m,-1);
    return(
        <div className="stepper">
            {PIPELINE.map(([label,type],i)=>{
                let cls='',icon=String(i+1);
                if(terminalOK&&has(type)){cls='done';icon='✓'}
                else if(terminalFail&&has(type)){cls=type==='execution.started'?'fail':'done';icon=type==='execution.started'?'×':'✓'}
                else if(i<lastIdx){cls='done';icon='✓'}
                else if(i===lastIdx){cls='act';icon='●'}
                return(
                    <div className={`pstep ${cls}`} key={type}>
                        <div className="ln"></div>
                        <div className="sc">{icon}</div>
                        <div className="sl">{label}</div>
                    </div>
                );
            })}
        </div>
    );
}

function LatestDecision({flow,audit,runBatch,go}){
    const recents=useRecents(flow);

        const s=audit.find(ok)||audit.find(e=>e.result!=='blocked'&&e.result!=='denied');
        return s?s.event_id:null;
    })();
    const [dec,setDec]=useState(null);
    const [loading,setLoading]=useState(false);
    useEffect(()=>{
        if(recents.length){setDec(normLiveDecision(recents[0]));setLoading(false);return;}
        if(!persId){setDec(null);setLoading(false);return;}
        let on=true;setLoading(true);setDec(null);
        fetch(`${API}/api/transaction/${encodeURIComponent(persId)}/trace`)
            .then(r=>r.ok?r.json():Promise.reject())
            .then(t=>{if(on){setDec(normTraceDecision(t));setLoading(false);}})
            .catch(()=>{if(on){setLoading(false);setDec(null);}});
        return()=>{on=false};
    },[recents[0]&&recents[0].key,persId]);
    return(
        <div className="section">
            <H title="Latest Recovery Decision" sub={recents.length?'Shared live from the closed-loop stream':'Most recent decision · '+persId} right={<span className="chip info">explainable AI</span>}/>

    );
}

function useRecents(flow){
    const groups={};
    for(const ev of flow||[]){
        const key=ev.transaction_id||ev.correlation_id||ev.event_id;
        const g=groups[key]||(groups[key]={key,event_id:ev.event_id,stages:[],amount:0,type:'',action:'—',status:'pending',ts:ev.timestamp});
        g.stages.push(ev);
        if(!g.event_id)g.event_id=ev.event_id;
        g.ts=ev.timestamp||g.ts;
        const p=ev.payload||{};
        if(ev.type==='event.received'){g.type=p.event_type||ev.event_type||'payment.failed';g.amount=p.amount||0;}
        if(ev.type==='strategy.ranked'&&p.selected)g.action=p.selected;
        if(ev.type==='execution.started'&&p.attempt!=null)g.stages['attempt']=p.attempt;
        if(ev.type==='payment.confirmed'){g.status='confirmed';g.amount=p.amount||g.amount;}
        if(ev.type==='payment.pending')g.status='pending';
        if(ev.type==='payment.failed')g.status='failed';
        if(ev.type==='recovery.blocked')g.status='blocked';
        if(ev.type==='human_review.required')g.status='human_review';
        if(ev.type==='event.completed'&&!g.status||ev.type==='recovery.completed')g.status=g.status||'pending';
    }
    return Object.values(groups).sort((a,b)=>String(b.ts).localeCompare(String(a.ts))||0);
}

function StatusChip({s}){
    const map={confirmed:['ok','Confirmed'],success:['ok','Confirmed'],blocked:['bad','Blocked'],denied:['bad','Denied'],failed:['bad','Failed'],human_review:['warn','Human Review'],human:['warn','Human Review'],pending:['warn','Pending'],processing:['info','Processing'],pending_webhook:['warn','Pending']};
    const[m,label]=map[s]||['muted',s];
    const icon=m==='ok'?'✓':m==='bad'?'×':m==='warn'?'◷':m==='info'?'●':'·';
    return <span className={`chip ${m}`}>{icon} {label}</span>;
}

function Transactions({audit,openDrawer}){
    const[q,setQ]=useState('');
    const rows=(audit||[]).filter(e=>{
        const s=q.trim().toLowerCase();
        if(!s)return true;
        return [e.event_id,e.customer_id,e.action,(e.amount_attempted||'').toString()].join(' ').toLowerCase().includes(s);
    });
    return(
        <div>
            <div className="input" style={{maxWidth:420,marginBottom:18}} placeholder="Search by event id, customer, action or amount…" onKeyUp={e=>setQ(e.target.value)}/>
            <div className="card" style={{padding:0,overflow:'hidden'}}>
                <table>
                    <thead><tr><th>Event</th><th>Customer</th><th>Action</th><th className="right">Amount</th><th>Policy</th><th>Result</th><th>Time</th></tr></thead>
                    <tbody>
                        {rows.slice(0,60).map(e=>{
                            const pd=(()=>{try{return JSON.parse(e.policy_decision)}catch(x){return null}})();
                            const verdict=pd&&pd.verdict;
                            return(
                                <tr key={e.event_id+'_'+e.timestamp} onClick={()=>openDrawer(e.event_id)}>
                                    <td><span className="mono">{e.event_id}</span></td>
                                    <td>{e.customer_id}</td>
                                    <td>{ACTION_LABELS[e.action]||e.action}</td>
                                    <td className="right">{fmt(e.amount_attempted)}</td>
                                    <td><PolicyChip v={verdict} status={e.result}/></td>
                                    <td><StatusChip s={e.result||e.workflow_status}/></td>
                                    <td className="mono" style={{color:'var(--ink-3)'}}>{timeOf(e.timestamp)}</td>
                                </tr>
                            );
                        })}
                        {!rows.length&&<tr><td colSpan={7}><div className="empty">No matching transactions.</div></td></tr>}
                    </tbody>
                </table>
            </div>
            <div className="k" style={{color:'var(--ink-3)',marginTop:12}}>{rows.length} transactions · click a row to open the full decision trace</div>
        </div>
    );
}

function verdictOf(e){try{const pd=JSON.parse(e.policy_decision);if(pd&&pd.verdict)return pd.verdict}catch(x){}return null}
function finalStatus(e){if(e.status==='human_review')return 'HUMAN_REVIEW';if(e.status==='blocked')return 'DENY';return verdictOf(e)||'ALLOW'}
function PolicyChip({v,status}){
    const final=status==='human_review'?'HUMAN_REVIEW':status==='blocked'?'DENY':v;
    const map={ALLOW:['ok','Allowed'],MODIFY:['warn','Modified'],DENY:['bad','Denied'],HUMAN_REVIEW:['warn','Human Review'],PENDING:['info','Pending']};
    const[m,l]=map[final]||['muted',final||'—'];
    return <span className={`chip ${m}`}>{l}</span>;
}

/* ---------------- BENCHMARK ---------------- */

    const b=hero;
    const atRisk=b.categories.reduce((s,c)=>s+c.at_risk,0);
    const amountRate=b.at_riskRate||pct(b.batch_recovered_amount,atRisk);
    const attempts=b.batch_recovery_attempts||(interventions?interventions.reduce((s,iv)=>s+iv.count,0):0);

    return(
        <div>
            <div className="hero-row">
